<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
html, body { margin: 0; padding: 0; background: #0e1014; color: #e6e1e5; font-family: "Segoe UI", Tahoma, sans-serif; }
.wrap { padding: 24px 40px; max-width: 920px; margin: 0 auto; }
h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; color: #ffe08a; }
.sub { margin: 0 0 14px; font-size: 13px; color: #9a9690; }
.scene { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.panel {
  background: linear-gradient(180deg, #3a5a3a 0%, #2a4028 40%, #1a2818 100%);
  border: 1px solid #333; border-radius: 10px; padding: 28px 12px 18px;
  min-height: 180px; position: relative; overflow: hidden;
}
.panel::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(0,0,0,.08) 15px, rgba(0,0,0,.08) 16px),
    repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(0,0,0,.06) 15px, rgba(0,0,0,.06) 16px);
}
.label {
  position: relative; z-index: 1; font-size: 11px; letter-spacing: .06em;
  text-transform: uppercase; color: rgba(255,255,255,.55); margin-bottom: 40px;
}
.char {
  position: relative; z-index: 1; width: 42px; height: 56px; margin: 0 auto;
  background: linear-gradient(180deg, #6a8ab0, #3a5070);
  border: 2px solid #1a2030; border-radius: 4px; box-shadow: 0 2px 0 #0a1018;
}
.tag {
  position: absolute; z-index: 2; left: 50%; transform: translateX(-50%);
  top: 52px; white-space: nowrap; font-family: Consolas, "Courier New", monospace;
  font-size: 12px; line-height: 1;
}
.stock { background: #716D6C; padding: 1px; }
.stock .inner { background: #201F1F; color: #fff; padding: 2px 6px; }
.soft {
  background: rgba(22,24,28,.42); padding: 1px;
  box-shadow: 0 1px 2px rgba(0,0,0,.35);
}
.soft .inner {
  background: rgba(7,8,10,.72); color: #fff; padding: 2px 7px;
  text-shadow: -1px 0 #000, 1px 0 #000, 0 -1px #000, 0 1px #000, 0 1px 2px rgba(0,0,0,.9);
}
.soft.party .inner { color: #c9a8e0; }
.soft.online {
  box-shadow: inset 1px 0 0 #6EC344, inset -1px 0 0 #6EC344, 0 1px 2px rgba(0,0,0,.35);
}
.row2 { margin-top: 14px; display: flex; gap: 18px; justify-content: center; position: relative; z-index: 2; }
.mini { position: relative; width: 70px; height: 70px; }
.mini .char { width: 28px; height: 38px; margin-top: 28px; }
.mini .tag { top: 8px; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Nameplates</h1>
  <p class="sub">Stock chunky bar vs soft translucent plate (HP/MP chrome unchanged in-game)</p>
  <div class="scene">
    <div class="panel">
      <div class="label">Before · stock</div>
      <div class="tag stock"><div class="inner">Zincao</div></div>
      <div class="char"></div>
      <div class="row2">
        <div class="mini"><div class="tag stock"><div class="inner">Boof</div></div><div class="char"></div></div>
        <div class="mini"><div class="tag stock"><div class="inner">Merchant</div></div><div class="char"></div></div>
      </div>
    </div>
    <div class="panel">
      <div class="label">After · soft plate</div>
      <div class="tag soft online"><div class="inner">Zincao</div></div>
      <div class="char"></div>
      <div class="row2">
        <div class="mini"><div class="tag soft party"><div class="inner">Boof</div></div><div class="char"></div></div>
        <div class="mini"><div class="tag soft"><div class="inner">Merchant</div></div><div class="char"></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
