<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
html, body {
  margin: 0; padding: 0; background: #0e1014;
  min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
  padding-top: 24px;
}
.phone {
  width: 390px; height: 720px; margin: 0; position: relative; overflow: hidden;
  background: radial-gradient(ellipse at 50% 18%, #1a2430 0%, transparent 55%),
    linear-gradient(180deg, #12161c, #0a0c10);
  font-family: "Segoe UI", Tahoma, sans-serif; color: #eee;
}
.map {
  position: absolute; inset: 0 0 56px 0; display: flex; align-items: center;
  justify-content: center; color: rgba(255,255,255,.18); font-size: 12px;
  letter-spacing: .08em; text-transform: uppercase;
}
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
  background: #1c1b1f; border-top: 1px solid rgba(230,225,229,.12);
  display: flex; align-items: center; justify-content: space-around; padding: 0 8px;
}
.dock span { font-size: 10px; color: #cac4d0; }
.shell {
  position: absolute; left: 8px; right: 8px; top: 8px; bottom: 56px;
  background: rgba(0,0,0,.92); border: 2px solid #555; border-radius: 16px 16px 0 0;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 12px 40px rgba(0,0,0,.55);
}
.head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; flex: 0 0 auto; }
.title { font-size: 18px; color: #ffe08a; font-weight: 600; }
.hint { font-size: 11px; color: #777; }
.grow { flex: 1; }
.expand {
  width: 40px; height: 40px; border: 1px solid #444; background: #1a1a1a; color: #ddd;
  border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.tabs {
  display: flex; gap: 4px; margin: 0 12px 8px; padding: 2px;
  background: #1a1a1a; border: 1px solid #444; border-radius: 10px;
}
.tab {
  flex: 1; min-height: 40px; border: 0; border-radius: 8px; background: transparent;
  color: #bbb; font: inherit; font-size: 14px; font-weight: 600;
}
.tab.on { background: #2a2410; color: #ffe08a; }
.count {
  font-size: 11px; color: #c9a227; background: #1a1608; border-radius: 999px;
  padding: 1px 7px; margin-left: 4px;
}
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 12px 12px; gap: 8px; }
.editor {
  flex: 1; min-height: 160px; background: #141414; border: 1px solid #555; border-radius: 4px;
  padding: 10px; font-family: Consolas, "Courier New", monospace; font-size: 14px;
  color: #cde; line-height: 1.45; white-space: pre;
}
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  min-height: 44px; padding: 10px 14px; border: 1px solid #a86; background: #2a2410;
  color: #ffe08a; font-size: 15px; border-radius: 2px;
}
.btn.ghost { border-color: #555; background: #1a1a1a; color: #ccc; }
.inp {
  flex: 1 1 120px; min-height: 44px; min-width: 100px; background: #141414;
  border: 1px solid #555; color: #eee; font-size: 16px; padding: 10px 12px;
}
.status { font-size: 12px; color: #9a9; min-height: 1.25em; }
</style>
</head>
<body>
<div class="phone">
  <div class="map">game map</div>
  <div class="shell">
    <div class="head">
      <div class="title">Command</div>
      <div class="hint">swipe title to close</div>
      <div class="grow"></div>
      <div class="expand">⛶</div>
    </div>
    <div class="tabs">
      <button class="tab on">Code</button>
      <button class="tab">Snippets<span class="count">3</span></button>
    </div>
    <div class="body">
      <div class="editor">loot()
use_skill('town')</div>
      <div class="tools">
        <button class="btn">Run</button>
        <input class="inp" value="town hop" readonly/>
        <button class="btn ghost">Save as</button>
      </div>
      <div class="status">Updated “town hop”</div>
    </div>
  </div>
  <div class="dock"><span>Apps</span><span>Chat</span><span>Cmd</span><span>⚙</span></div>
</div>
</body>
</html>
