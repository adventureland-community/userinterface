<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Phone home · Material dock</title>
<style>
html,body{margin:0;padding:16px;background:#0e1014;height:auto;font-family:Roboto,"Segoe UI",system-ui,sans-serif;color:#e6e1e5}
.phone{width:390px;height:780px;margin:0 auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 18%,#1a2430 0%,transparent 55%),linear-gradient(180deg,#12161c,#0a0c10);border-radius:8px}
.map{position:absolute;inset:0 0 72px 0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.18);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.dock{position:absolute;left:0;right:0;bottom:0;background:#1c1b1f;border-top:1px solid rgba(230,225,229,.12);padding:10px 2px 8px;display:flex;align-items:stretch}
.nub{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:rgba(230,225,229,.35)}
.status{flex:1;min-width:0;margin:0 2px;padding:6px 10px;border:none;border-radius:12px;background:transparent;color:#cac4d0;text-align:left;font:inherit;min-height:52px}
.status .eye{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#8a93a0}
.status .title{display:block;font-size:13px;font-weight:600;color:#e6e1e5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .meta{display:block;font-size:11px;color:#9dd4ec}
.apps{flex:0 0 72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:#9dd4ec;font:inherit;font-size:10px;font-weight:500}
.glyph{width:48px;height:26px;border-radius:14px;background:rgba(157,212,236,.16);display:flex;align-items:center;justify-content:center;font-size:14px}
.pager{position:absolute;left:0;right:0;bottom:78px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px 8px;padding:4px 10px}
.side{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 8px;border:1px solid transparent;border-radius:8px;background:rgba(28,27,31,.72);color:#cac4d0;font:inherit;font-size:11px;font-weight:600}
.side.prev{justify-self:start}.side.next{justify-self:end}
.center{display:flex;flex-direction:column;align-items:center;gap:3px}
.cur{font-size:12px;font-weight:700;color:#e8eef4;text-shadow:0 1px 2px rgba(0,0,0,.65)}
.track{display:flex;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);display:block}
.dot.on{background:#fff;transform:scale(1.25)}
.cap{text-align:center;font-size:11px;color:#8a93a0;margin-top:8px}
</style></head><body>
<div class="phone">
  <div class="map">map / combat</div>
  <div class="pager" aria-label="Home screens">
    <button class="side prev" type="button"><span>‹</span><span>Home</span></button>
    <div class="center"><div class="cur">Players</div><div class="track"><i class="dot"></i><i class="dot on"></i><i class="dot"></i></div></div>
    <button class="side next" type="button"><span>Coop</span><span>›</span></button>
  </div>
  <div class="dock">
    <span class="nub"></span>
    <button class="status" type="button"><span class="eye">Character</span><span class="title">Not observing</span><span class="meta">Tap to watch</span></button>
    <button class="apps" type="button"><span class="glyph">▦</span>Apps</button>
    <button class="status" type="button"><span class="eye">Server</span><span class="title">EU I</span><span class="meta">68 · 54ms</span></button>
  </div>
</div>
<p class="cap">Home — labeled page pager · Character · Apps · Server</p>
</body></html>
