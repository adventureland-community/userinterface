<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Phone Bag sheet</title>
<style>
html,body{margin:0;padding:16px;background:#0e1014;height:auto;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#e8e8e8}
.phone{width:390px;height:780px;margin:0 auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 18%,#1a2430 0%,transparent 55%),linear-gradient(180deg,#12161c,#0a0c10);border-radius:8px}
.map{position:absolute;inset:0 0 56px 0}
.dock{position:absolute;left:0;right:0;bottom:0;height:48px;background:#1c1b1f;border-top:1px solid rgba(230,225,229,.12);display:flex;align-items:center;justify-content:space-around;font-size:10px;color:#cac4d0}
.shell{position:absolute;left:8px;right:8px;top:8px;bottom:56px;background:#0e0e0e;border:2px solid #555;border-radius:16px 16px 0 0;overflow:hidden;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #2a2a2a;order:1;flex:0 0 auto}
.title{font-size:18px;color:#ffe08a;font-weight:600;margin:0}
.grow{flex:1}
.meta{font-size:12px;color:#8a93a0}
.expand{width:36px;height:36px;border:1px solid #444;background:#1a1a1a;color:#ddd;border-radius:4px;display:flex;align-items:center;justify-content:center}
.body{flex:1 1 auto;min-height:0;overflow:auto;display:flex;align-items:flex-end;justify-content:center;padding:8px 4px 10px;order:2}
.board{zoom:1.45;width:max-content;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(7,40px);gap:2px}
.slot{width:40px;height:40px;background:#161616;border:1px solid #2a2a2a;border-radius:3px;position:relative;display:flex;align-items:center;justify-content:center;font-size:16px}
.slot .q{position:absolute;right:1px;bottom:0;font-size:9px;color:#ffe08a;font-weight:700}
.foot{order:3;flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 10px;border-top:1px solid #333;background:#121212}
.foot .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#aaa}
.foot button{min-height:40px;padding:8px 12px;border:1px solid #666;background:#222;color:#ddd;font:inherit;font-size:14px}
.cap{text-align:center;font-size:11px;color:#8a93a0;margin-top:8px}
</style></head><body>
<div class="phone">
  <div class="map"></div>
  <div class="shell">
    <div class="head"><h1 class="title">Bag</h1><div class="grow"></div><span class="meta">thmsn</span><div class="expand">⛶</div></div>
    <div class="body"><div class="board" id="board"></div></div>
    <div class="foot"><span class="lab">Synced just now · observing thmsn</span><button type="button">Sort</button><button type="button">Refresh</button></div>
  </div>
  <div class="dock"><span>Apps</span><span>Chat</span><span>Cmd</span><span>⚙</span></div>
</div>
<p class="cap">Bag — grid sits on the sync foot (no dead gap under inventory)</p>
<script>
const icons=['📕','⚔','🛡','🎩','🧥','📜','🧪','💎','🔑','🍬','🎄','🏹','🪙','📦','💍','🔮','🪓','🦴','🪵','🥚','🧤','👟','🧿','🪬'];
const g=document.createElement('div'); g.className='grid';
for(let i=0;i<42;i++){
  const s=document.createElement('div'); s.className='slot';
  s.innerHTML=icons[i%icons.length]+'<span class="q">'+(i%9+1)+'</span>';
  g.appendChild(s);
}
document.getElementById('board').appendChild(g);
</script>
</body></html>
