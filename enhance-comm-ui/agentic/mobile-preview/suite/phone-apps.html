<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Phone Apps sheet</title>
<style>
html,body{margin:0;padding:16px;background:#0e1014;height:auto;font-family:Roboto,"Segoe UI",system-ui,sans-serif;color:#e6e1e5}
.phone{width:390px;height:780px;margin:0 auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 18%,#1a2430 0%,transparent 55%),linear-gradient(180deg,#12161c,#0a0c10);border-radius:8px}
.map{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;inset:0;background:#1c1b1f;border-radius:0;display:flex;flex-direction:column;padding:0 0 12px}
.head{display:flex;align-items:center;padding:14px 16px 10px}
.head h1{margin:0;font-size:22px;font-weight:600;flex:1}
.done{border:none;background:#9dd4ec;color:#0e1014;font-weight:600;padding:8px 16px;border-radius:999px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 12px;padding:12px 10px 20px;overflow:auto;align-content:start;flex:1}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;border:none;background:transparent;color:#e6e1e5;font:inherit}
.tile .g{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.tile .l{font-size:12px;font-weight:500}
.tile .h{font-size:10px;color:#938f99}
.tile.muted{opacity:.55}
.tile.on .g{box-shadow:0 0 0 2px #9dd4ec}
.cap{text-align:center;font-size:11px;color:#8a93a0;margin-top:8px}
</style></head><body>
<div class="phone">
  <div class="map"></div>
  <div class="sheet">
    <div class="head"><h1>Apps</h1><button class="done" type="button">Done</button></div>
    <div class="grid">
      <button class="tile" type="button"><span class="g" style="background:#2b6cb0">C</span><span class="l">Chat</span></button>
      <button class="tile" type="button"><span class="g" style="background:#3d5a8a">&lt;/&gt;</span><span class="l">Cmd</span></button>
      <button class="tile" type="button"><span class="g" style="background:#5a3d8a">✉</span><span class="l">Mail</span></button>
      <button class="tile muted" type="button"><span class="g" style="background:#8a6a3d">B</span><span class="l">Bag</span><span class="h">Observe first</span></button>
      <button class="tile" type="button"><span class="g" style="background:#3d8a55">$</span><span class="l">Bank</span></button>
      <button class="tile" type="button"><span class="g" style="background:#8a3d5c">S</span><span class="l">Market</span></button>
      <button class="tile" type="button"><span class="g" style="background:#4a5568">⚙</span><span class="l">Settings</span></button>
      <button class="tile" type="button"><span class="g" style="background:#1e3a5f">⛶</span><span class="l">Full</span></button>
      <button class="tile" type="button"><span class="g" style="background:#2b6cb0">+</span><span class="l">Add meter</span></button>
    </div>
  </div>
</div>
<p class="cap">Apps — icon grid · Bag muted without observer · Full = fullscreen</p>
</body></html>
