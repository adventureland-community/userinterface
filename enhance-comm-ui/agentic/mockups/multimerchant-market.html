<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Market</title>
  <!--
    Throwaway Market hub mockup.
    Uses shared.css panel chrome + TradeSlotCell-like slots + real pull_merchants sample.
  -->
  <link rel="stylesheet" href="shared.css" />
  <style>
    /* Market mockup — denser readable HUD over shared.css */
    .market-shell {
      --mk-line: #2a2a2a;
      --mk-line-soft: #1e1e1e;
      --mk-panel: #0b0b0b;
      --mk-panel-2: #101010;
      --mk-muted: #777;
      font-family: Consolas, "Segoe UI", Tahoma, sans-serif;
      width: min(1360px, 100%);
      height: min(780px, calc(100vh - 52px));
      margin: 0 auto;
      max-width: none;
      gap: 0;
      overflow: hidden;
    }
    body.mock-bg { padding: 14px 16px 20px; }
    .proto {
      max-width: 1360px;
      margin: 0 auto 8px;
      color: #888;
      font-size: 12px;
      font-family: Consolas, "Segoe UI", sans-serif;
    }
    .proto strong { color: var(--accent); }
    .proto a { color: var(--gold); }

    .market-shell .ecu-panel__head {
      padding: 9px 12px 8px;
      border-bottom: 1px solid var(--mk-line);
      flex-wrap: nowrap;
      background: #0d0d0d;
    }
    .market-shell .ecu-panel__title {
      font-size: 15px;
      letter-spacing: .04em;
    }
    .market-shell .ecu-panel__pill {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    .market-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--mk-line);
      background: #0c0c0c;
      flex-wrap: wrap;
    }
    .market-tools .search {
      flex: 1 1 220px;
      min-width: 160px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid #3a3a3a;
      background: #080808;
    }
    .market-tools .search:focus-within {
      border-color: rgba(232, 201, 106, .55);
    }
    .market-tools .search .ico { color: #555; font-size: 13px; line-height: 1; }
    .market-tools .search .clear {
      flex: 0 0 auto;
      appearance: none;
      border: 0;
      background: transparent;
      color: #666;
      font: inherit;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      cursor: pointer;
      border-radius: 2px;
    }
    .market-tools .search .clear:hover { color: #ccc; background: #1a1a1a; }
    .market-tools .search input {
      flex: 1;
      border: 0;
      background: transparent;
      color: #eee;
      font: inherit;
      font-size: 13px;
      outline: none;
      min-width: 0;
    }
    .search-wrap {
      position: relative;
      flex: 1 1 220px;
      min-width: 160px;
    }
    .search-wrap .search { width: 100%; }
    .search-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 40;
      max-height: min(360px, 55vh);
      overflow: auto;
      border: 1px solid #3a3a3a;
      background: #121212;
      box-shadow: 0 12px 28px rgba(0,0,0,.55);
    }
    .search-menu__sec {
      padding: 8px 0 4px;
    }
    .search-menu__sec + .search-menu__sec {
      border-top: 1px solid #242424;
    }
    .search-menu__h {
      padding: 2px 12px 6px;
      color: #666;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .search-menu__row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      color: #ddd;
      font: inherit;
      font-size: 12px;
      text-align: left;
      padding: 7px 12px;
      cursor: pointer;
    }
    .search-menu__row:hover,
    .search-menu__row.is-hi {
      background: #1c1c1c;
    }
    .search-menu__op {
      flex: 0 0 auto;
      color: #e8c96a;
      font-family: Consolas, "Segoe UI", monospace;
      font-weight: 600;
    }
    .search-menu__label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search-menu__hint {
      flex: 0 1 auto;
      color: #666;
      font-size: 11px;
      text-align: right;
      max-width: 46%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search-menu__ico {
      flex: 0 0 auto;
      color: #555;
      width: 14px;
      text-align: center;
    }
    .search-menu__foot {
      border-top: 1px solid #242424;
      padding: 6px 12px 8px;
      color: #666;
      font-size: 11px;
    }
    .search-menu__foot kbd {
      float: right;
      color: #888;
      border: 1px solid #333;
      padding: 0 5px;
      border-radius: 2px;
      font-size: 10px;
    }
    .seg {
      display: inline-flex;
      border: 1px solid #3a3a3a;
      height: 30px;
      background: #080808;
    }
    .seg button {
      border: 0;
      background: transparent;
      color: #888;
      font: inherit;
      font-size: 12px;
      padding: 0 11px;
      cursor: pointer;
      height: 100%;
    }
    .seg button + button { border-left: 1px solid #2a2a2a; }
    .seg button.is-on {
      color: var(--accent);
      background: #1a1810;
    }
    .seg button:hover:not(.is-on) { color: #ccc; background: #121212; }
    .tog-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }
    .tog {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .tog:hover { color: #bbb; }
    .tog input { accent-color: var(--accent); margin: 0; }

    .market-body {
      display: grid;
      grid-template-columns: 256px minmax(0, 1fr) 420px;
      min-height: 0;
      flex: 1;
      overflow: hidden;
      overflow-x: hidden;
    }
    .col {
      min-height: 0;
      overflow: auto;
      overflow-x: hidden;
      border-right: 1px solid var(--mk-line);
      background: var(--mk-panel);
    }
    .col:last-child { border-right: 0; }
    .col--market,
    .col--focus,
    .you {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .col--market .ph,
    .col--focus > .ph,
    .col--focus > .focus-top { flex: 0 0 auto; }
    .col--market .item-grid,
    .col--market .market-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .col--focus > .focus-offers {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .focus-offers { border-top: 1px solid var(--mk-line); }
    .focus-offers--split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      gap: 0;
    }
    .focus-col {
      min-width: 0;
    }
    .focus-col--sells {
      border-right: 1px solid var(--mk-line);
    }
    .focus-col__h {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 9px;
      font-size: 10px;
      letter-spacing: .07em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--mk-line-soft);
      background: #101010;
    }
    .focus-col__h .lbl.sells { color: #c97a5a; font-weight: 700; }
    .focus-col__h .lbl.wants { color: #6aab8e; font-weight: 700; }
    .focus-col__h em {
      font-style: normal;
      color: var(--mk-muted);
      letter-spacing: 0;
      text-transform: none;
      font-size: 11px;
    }
    .focus-col__empty {
      padding: 14px 10px;
      font-size: 11px;
      color: #555;
      line-height: 1.35;
    }
    .focus-offers .offer {
      padding: 8px 9px;
      border-bottom: 1px solid var(--mk-line-soft);
    }
    .focus-offers .offer:hover { background: #101010; }
    .focus-offers .offer.is-flash {
      background: #1a1810;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .focus-offers .offer.is-blocked { opacity: .55; }
    .focus-offers--split .offer-main {
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
    }
    .focus-offers--split .offer-ops {
      flex-wrap: wrap;
      gap: 5px;
    }
    .focus-offers--split .offer-ops .qty-wrap input {
      width: 44px;
    }
    .focus-offers--split .row-act.is-primary {
      min-width: 52px;
      padding: 0 8px;
    }
    .you { background: #090909; }
    .you-bag {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    .you-stand {
      flex: 0 0 auto;
      border-top: 1px solid var(--mk-line);
      background: #0c0c0c;
      max-height: 46%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .ph {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      font-size: 11px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: #b5a56a;
      background: #121212;
      border-bottom: 1px solid var(--mk-line);
    }
    .ph em {
      font-style: normal;
      color: var(--mk-muted);
      letter-spacing: 0;
      text-transform: none;
      font-size: 11px;
    }
    .ph-tools {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      margin-left: auto;
    }
    .ph-tools .seg { height: 24px; }
    .ph-tools .seg button {
      font-size: 11px;
      padding: 0 8px;
    }
    .ph-tools .btn {
      padding: 3px 8px;
      font-size: 11px;
      height: 24px;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(4, 52px);
      justify-content: start;
      gap: 6px;
      padding: 10px;
    }
    .comm-trade-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      position: relative;
      width: 52px;
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 0;
      cursor: pointer;
    }
    .comm-trade-slot.is-on .ecu-item-icon__frame,
    .comm-trade-slot.is-on .slot-empty {
      box-shadow: 0 0 0 2px rgba(232, 201, 106, .75);
    }
    .comm-trade-slot:hover .ecu-item-icon__frame,
    .comm-trade-slot:hover .slot-empty { border-color: #777; }
    .comm-trade-slot.is-disabled { opacity: .45; }
    .slot-art { position: relative; line-height: 0; }
    .slot-empty {
      width: 46px;
      height: 46px;
      box-sizing: border-box;
      background: #000;
      border: 2px solid #292929;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .slot-badge {
      position: absolute;
      top: -2px;
      left: -2px;
      min-width: 14px;
      height: 14px;
      padding: 0 3px;
      box-sizing: border-box;
      font-size: 10px;
      line-height: 14px;
      text-align: center;
      color: #eee;
      background: #3a2a10;
      border: 1px solid #666;
      z-index: 1;
    }
    .slot-badge.is-buy { background: #1a3a4a; }
    .slot-price {
      font-size: 11px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      max-width: 52px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-height: 14px;
    }
    .ecu-item-icon {
      display: inline-block;
      overflow: hidden;
      line-height: 0;
      image-rendering: pixelated;
    }
    .ecu-item-icon__frame {
      display: block;
      overflow: hidden;
      background: #000;
      border: 2px solid #555;
      box-sizing: border-box;
    }
    .ecu-item-icon img {
      display: block;
      image-rendering: pixelated;
      max-width: none;
    }
    .ecu-game-icon-letter {
      display: inline-block;
      text-align: center;
      background: #222;
      border: 2px solid #555;
      color: #aaa;
      font-size: 14px;
      box-sizing: border-box;
    }

    .you-acts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 0 10px 10px;
      margin-top: auto;
    }
    .btn {
      appearance: none;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #eee;
      font: inherit;
      font-size: 12px;
      padding: 7px 8px;
      cursor: pointer;
      text-align: center;
      line-height: 1.2;
    }
    .btn:hover:not(:disabled) { border-color: #777; background: #202020; }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn-gold {
      border-color: rgba(232, 201, 106, .5);
      color: var(--accent);
      background: #18150e;
    }
    .btn-sell {
      border-color: #6a4030;
      color: #e0a080;
      background: #181210;
    }
    .btn-ghost {
      background: transparent;
      color: #888;
    }
    .stand-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px 0;
      font-size: 11px;
      color: var(--mk-muted);
    }
    .stand-bar .st {
      color: #7aaf6e;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: 10px;
    }
    .stand-bar .st.off { color: #c66; }

    .slot-grid--stand {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      justify-content: stretch;
      gap: 5px;
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    .slot-grid--stand .comm-trade-slot {
      width: auto;
      max-width: 100%;
    }
    .slot-grid--stand .slot-art {
      margin: 0 auto;
    }
    .slot-grid--stand .slot-empty {
      margin: 0 auto;
    }
    .slot-grid--stand.cols-6 {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 3px;
      padding: 6px 8px 8px;
    }
    .slot-grid--stand.cols-6 .slot-empty {
      width: 100%;
      max-width: 36px;
      height: 36px;
      margin: 0 auto;
    }
    .slot-grid--stand.cols-6 .slot-price { font-size: 10px; }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      grid-auto-rows: minmax(168px, auto);
      gap: 8px;
      padding: 10px;
      align-content: start;
      align-items: stretch;
    }
    .item-card {
      appearance: none;
      border: 1px solid #2c2c2c;
      background: linear-gradient(180deg, #151515 0%, #0d0d0d 100%);
      color: inherit;
      font: inherit;
      padding: 0;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      min-height: 168px;
      height: auto;
      align-self: stretch;
      width: 100%;
      box-sizing: border-box;
      transition: border-color .12s, background .12s, box-shadow .12s;
    }
    .item-card .nm {
      flex: 0 0 auto;
      min-height: calc(1.35em * 2);
      padding: 8px 10px 6px;
      font-size: 12px;
      font-weight: 600;
      color: #f0f0f0;
      line-height: 1.35;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: normal;
    }
    .item-card__prices {
      flex: 0 0 auto;
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-top: 1px solid #222;
      background: rgba(0,0,0,.28);
    }
    .item-card:hover {
      border-color: #5a5a5a;
      background: linear-gradient(180deg, #1b1b1b 0%, #121212 100%);
    }
    .item-card.is-dual {
      border-color: #3a3830;
      background:
        linear-gradient(135deg, rgba(201, 122, 90, .08) 0%, transparent 46%),
        linear-gradient(315deg, rgba(106, 171, 142, .08) 0%, transparent 46%),
        linear-gradient(180deg, #151515 0%, #0d0d0d 100%);
    }
    .item-card.is-dual:hover {
      border-color: #5a5440;
    }
    .item-card.is-on {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(232, 201, 106, .28);
      background: linear-gradient(180deg, #1c1910 0%, #14120c 100%);
    }
    .item-card__top {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 10px 0;
      min-height: 48px;
    }
    .item-card__top .market-ico,
    .item-card__top .ecu-item-icon {
      flex: 0 0 auto;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.45));
    }
    .item-card__counts {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-end;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }
    .item-card__counts .s,
    .item-card__counts .b {
      padding: 2px 5px;
      min-width: 30px;
      text-align: center;
      border-radius: 2px;
      letter-spacing: .02em;
    }
    .item-card__counts .s {
      color: #e0a088;
      border: 1px solid #4a3028;
      background: #181210;
    }
    .item-card__counts .b {
      color: #8ec4a8;
      border: 1px solid #2a4034;
      background: #101812;
    }
    .item-card__counts .dim { opacity: .28; }
    .item-card__prices .row-p {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 7px 9px 8px;
      min-width: 0;
    }
    .item-card__prices .row-p + .row-p {
      border-left: 1px solid #222;
    }
    .item-card__prices .lbl {
      color: #777;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .item-card__prices .val {
      font-weight: 700;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-card__prices .val.sell { color: var(--gold); }
    .item-card__prices .val.buy { color: #8ec4a8; }
    .item-card__prices .val.none { color: #3f3f3f; font-weight: 400; }

    .offer-main {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }
    .offer-ops {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid #222;
    }
    .offer-ops .qty-wrap { margin-right: auto; }
    .offer-ops .row-act { flex: 0 0 auto; }
    .offer-ops .row-act.is-primary { min-width: 64px; }
    .offer-ops .row-act.is-all {
      min-width: 0;
      padding-left: 7px;
      padding-right: 7px;
      border-color: #444;
      color: #aaa;
      background: transparent;
    }
    .offer-ops .row-act.is-all.is-buy:not(:disabled) {
      border-color: rgba(232, 201, 106, .35);
      color: #cbb56a;
    }
    .offer-ops .row-act.is-all.is-sell:not(:disabled) {
      border-color: #5a4030;
      color: #c09070;
    }

    .group { border-bottom: 1px solid var(--mk-line); }
    .group > summary {
      list-style: none;
      display: grid;
      grid-template-columns: 46px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px 10px;
      cursor: pointer;
      background: #101010;
    }
    .group > summary::-webkit-details-marker { display: none; }
    .group > summary:hover { background: #161616; }
    .g-name { font-weight: 600; color: #eee; font-size: 13px; }
    .g-sub { font-size: 11px; color: var(--mk-muted); margin-top: 1px; }
    .g-best {
      text-align: right;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--gold);
      line-height: 1.25;
    }
    .g-best span { display: block; color: #666; font-size: 10px; }

    .row {
      appearance: none;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 6px 10px 6px 16px;
      border: 0;
      border-bottom: 1px solid var(--mk-line-soft);
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .row:hover { background: #151515; }
    .row.is-on {
      background: #1a1810;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .qty-wrap {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--mk-muted);
      letter-spacing: .03em;
      text-transform: uppercase;
    }
    .qty-wrap input {
      width: 52px;
      height: 26px;
      padding: 0 6px;
      border: 1px solid #444;
      background: #0e0e0e;
      color: #eee;

<body class="mock-bg">
  <p class="proto">
    <a href="index.html">← mockups</a>
    · <strong>PROTOTYPE</strong> — Market hub. Bag + stand always on.
    Data: <code>pull_merchants</code> sample
    (<span id="dataStamp">…</span>).
