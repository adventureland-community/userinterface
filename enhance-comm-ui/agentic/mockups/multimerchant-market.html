  </p>
  <div class="ecu-panel market-shell" id="market"></div>
  <div class="toast" id="toast"></div>

  <script src="market-item-icons.js?v=3"></script>
  <script>
    const OBS = {
      name: "You",
      map: "main",
      x: 40,
      y: -40,
      server: "SR_EUI",
      gold: 2_500_000,
      party: new Set(["Ploob"]),
      friends: new Set(["Aleyna", "Selka"]),
    };

    /** Your stand — L80 merchant → 30 trade slots (same tier as TradeGrid). */
    const YOU = {
      name: "You",
      level: 80,
      ctype: "merchant",
      stand: "stand0",
      status: "you",
      map: OBS.map,
      server: OBS.server,
      standOpen: true,
      slots: {
        trade1: { name: "helmet", level: 5, price: 120000 },
        trade2: { name: "mpot1", price: 1800, b: true, q: 999 },
        trade3: { name: "scroll1", price: 900, b: true, q: 400 },
        trade5: { name: "cryptkey", price: 2500000 },
        trade8: { name: "seashell", price: 400, q: 99 },
        trade12: { name: "firestaff", level: 7, price: 480000 },
        trade18: { name: "cscroll0", price: 4800, b: true, q: 50 },
      },
    };

    const BAG = [
      { name: "mpot1", q: 40 },
      { name: "hpot1", q: 12 },
      { name: "cryptkey", q: 1 },
      { name: "essenceoffire", q: 3 },
      { name: "firestaff", level: 7, q: 1 },
      { name: "scroll1", q: 20 },
      { name: "cscroll0", q: 8 },
      { name: "seashell", q: 50 },
    ];

    const state = {
      chars: [],
      pulledAt: null,
      filter: "",
      searchOpen: false,
      searchHi: 0,
      facet: "all",
      view: "grid",
      standCompact: true,
      nearOnly: false,
      canAfford: false,
      haveStock: false,
      bagName: null,
      gridItem: null,
      offerKey: null,
      standSlot: null,
      travel: null,
      consumedKeys: {},
      qtyByKey: {},
      flashKey: null,
    };

    /** Types that stack in Adventure Land (assets omit `s`). */
    const STACK_TYPES = new Set([
      "material",
      "pot",
      "uscroll",
      "cscroll",
      "pscroll",
      "token",
      "offering",
      "quest",
      "elixir",
      "throw",
      "gem",
      "misc",
      "jar",
      "bank_key",
      "dungeon_key",
    ]);

    const root = document.getElementById("market");
    const toastEl = document.getElementById("toast");
    const stampEl = document.getElementById("dataStamp");
    let toastTimer = 0;

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }
    function fmt(n) {
      if (n == null || !Number.isFinite(n)) return "?";
      const a = Math.abs(n);
      if (a >= 1e9) return (n / 1e9).toFixed(a >= 1e10 ? 0 : 1) + "B";
      if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";
      if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e4 ? 0 : 1) + "k";
      return String(Math.round(n));
    }
    function parseAmount(raw) {
      const s = String(raw || "")
        .trim()
        .toLowerCase()
        .replace(/,/g, "");
      const m = /^([<>]=?|=)?\s*(\d+(?:\.\d+)?)\s*([kmb])?$/.exec(s);
      if (!m) return null;
      let n = parseFloat(m[2]);
      if (!Number.isFinite(n)) return null;
      const u = m[3];
      if (u === "k") n *= 1e3;
      else if (u === "m") n *= 1e6;
      else if (u === "b") n *= 1e9;
      return { op: m[1] || "=", n };
    }

    /** Split on spaces while keeping "quoted phrases" intact. */
    function tokenizeQuery(raw) {
      const s = String(raw || "").trim();
      if (!s) return [];
      const out = [];
      let cur = "";
      let quote = null;
      for (let i = 0; i < s.length; i++) {
        const ch = s.charAt(i);
        if (quote) {
          if (ch === quote) {
            quote = null;
            cur += ch;
          } else cur += ch;
          continue;
        }
        if (ch === '"' || ch === "'") {
          quote = ch;
          cur += ch;
          continue;
        }
        if (/\s/.test(ch)) {
          if (cur) {
            out.push(cur);
            cur = "";
          }
          continue;
        }
        cur += ch;
      }
      if (cur) out.push(cur);
      return out;
    }
    function stripQuotes(s) {
      if (s.length >= 2) {
        const a = s.charAt(0);
        const b = s.charAt(s.length - 1);
        if ((a === '"' && b === '"') || (a === "'" && b === "'")) {
          return s.slice(1, -1);
        }
      }
      return s;
    }
    const MARKET_OPS =
      /^(item|merchant|mer|title|stat|attr|has|is|level|price|map|server):(.*)$/i;

    function splitOrValues(raw) {
      return String(raw || "")
        .split(/[|,]/)
        .map((s) => s.trim())
        .filter(Boolean);
    }

    function parseClauseToken(tokIn) {
      let tok = tokIn;
      let negate = false;
      if (tok.charAt(0) === "-") {
        negate = true;
        tok = tok.slice(1);
        if (!tok) return null;
      }
      const m = MARKET_OPS.exec(tok);
      if (m) {
        const op = m[1].toLowerCase();
        const value = stripQuotes(m[2]);
        if (op === "mer") {
          return { kind: "merchant", values: splitOrValues(value), negate };
        }
        if (op === "is" || op === "has") {
          return {
            kind: op,
            values: splitOrValues(value).map((v) => v.toLowerCase()),
            negate,
          };
        }
        if (op === "stat") {
          return {
            kind: "stat",
            values: splitOrValues(value).map((v) => v.toLowerCase()),
            negate,
          };
        }
        if (op === "attr") {
          const specs = [];
          const parts = splitOrValues(value);
          for (let i = 0; i < parts.length; i++) {
            const part = parts[i];
            const am = /^([a-z_][a-z0-9_]*)\s*([<>]=?|=)?\s*(.*)$/i.exec(
              part.trim(),
            );
            if (!am) continue;
            const key = am[1].toLowerCase();
            const opSign = am[2] || "";
            const rhs = String(am[3] || "").trim();
            if (!opSign && !rhs) {
              specs.push({ key, any: true });
              continue;
            }
            const amt = parseAmount((opSign || "=") + rhs);
            if (amt) specs.push({ key, op: amt.op, n: amt.n });
            else specs.push({ key, any: true });
          }
          if (!specs.length) return null;
          return { kind: "attr", specs, negate };
        }
        if (op === "level" || op === "price") {
          const parts = splitOrValues(value);
          const amts = [];
          for (let i = 0; i < parts.length; i++) {
            const amt = parseAmount(parts[i]);
            if (amt) amts.push(amt);
          }
          if (amts.length) return { kind: op, amts, negate };
          if (value) return { kind: "text", values: [value], negate };
          return null;
        }
        if (
          op === "item" ||
          op === "title" ||
          op === "merchant" ||
          op === "map" ||
          op === "server"
        ) {
          return { kind: op, values: splitOrValues(value), negate };
        }
        return { kind: op, values: splitOrValues(value), negate };
      }
      return { kind: "text", values: [stripQuotes(tok)], negate };
    }

    /**
     * Parse into OR-of-AND groups.
     * Free-text words AND together; explicit OR / | splits groups.
     * Field values accept comma/| as OR: title:shiny,lucky
     */
    function parseMarketQuery(raw) {
      const tokens = tokenizeQuery(raw);
      const groups = [[]];
      for (let i = 0; i < tokens.length; i++) {
        const tok = tokens[i];
        if (/^(or|\|)$/i.test(tok)) {
          if (groups[groups.length - 1].length) groups.push([]);
          continue;
        }
        const clause = parseClauseToken(tok);
        if (clause) groups[groups.length - 1].push(clause);
      }
      return groups.filter((g) => g.length);
    }

    function cmpAmount(actual, amt) {
      const n = Number(actual) || 0;
      if (amt.op === ">=") return n >= amt.n;
      if (amt.op === ">") return n > amt.n;
      if (amt.op === "<=") return n <= amt.n;
      if (amt.op === "<") return n < amt.n;
      return n === amt.n;
    }

    function offerHaystack(r) {
      const nm = label(r.s.name, r.s).toLowerCase();
      const id = String(r.s.name || "").toLowerCase();
      const mer = String(r.mer.name || "").toLowerCase();
      const titleKey = String(r.s.p || "").toLowerCase();
      const titleDisp = window.MarketItemIcons.itemTitleLabel(r.s).toLowerCase();
      const stat = String(r.s.stat_type || "").toLowerCase();
      const base =
        ((window.MarketItemAssets &&
          window.MarketItemAssets.items &&
          window.MarketItemAssets.items[r.s.name] &&
          window.MarketItemAssets.items[r.s.name].name) ||
          r.s.name ||
          "") + "";
      return {
        nm,
        id,
        mer,
        titleKey,
        titleDisp,
        stat,
        base: base.toLowerCase(),
        hay: [nm, id, mer, titleKey, titleDisp, base.toLowerCase(), stat]
          .filter(Boolean)
          .join(" "),
      };
    }

    function valueHits(values, test) {
      if (!values || !values.length) return false;
      for (let i = 0; i < values.length; i++) {
        if (test(String(values[i] || "").toLowerCase())) return true;
      }
      return false;
    }

    function offerMatchesClause(r, c, h) {
      let hit = false;
      if (c.kind === "text") {
        hit = valueHits(c.values, (v) => h.hay.includes(v));
      } else if (c.kind === "item") {
        hit = valueHits(
          c.values,
          (v) => h.nm.includes(v) || h.id.includes(v) || h.base.includes(v),
        );
      } else if (c.kind === "title") {
        hit = valueHits(
          c.values,
          (v) =>
            (h.titleKey && h.titleKey.includes(v)) ||
            (h.titleDisp && h.titleDisp.includes(v)),
        );
      } else if (c.kind === "stat") {
        hit = valueHits(c.values, (v) => {
          if (v === "none" || v === "no" || v === "empty" || v === "!") {
            return !h.stat;
          }
          if (v === "any" || v === "yes" || v === "scrolled") return !!h.stat;
          return h.stat === v || h.stat.indexOf(v) === 0;
        });
      } else if (c.kind === "attr") {
        const prop = calcOfferProps(r.s);
        hit = (c.specs || []).some((spec) => {
          const n = Number(prop[spec.key]) || 0;
          if (spec.any) return n > 0;
          return cmpAmount(n, spec);
        });
      } else if (c.kind === "merchant") {
        hit = valueHits(c.values, (v) => h.mer.includes(v));
      } else if (c.kind === "map") {
        const map = String(r.mer.map || "").toLowerCase();
        hit = valueHits(c.values, (v) => map.includes(v));
      } else if (c.kind === "server") {
        const srv = String(r.mer.server || "").toLowerCase();
        const ui = serverUi(r.mer.server).toLowerCase();
        hit = valueHits(c.values, (v) => srv.includes(v) || ui.includes(v));
      } else if (c.kind === "level") {
        hit = (c.amts || []).some((amt) => cmpAmount(r.s.level || 0, amt));
      } else if (c.kind === "price") {
        hit = (c.amts || []).some((amt) => cmpAmount(r.s.price || 0, amt));
      } else if (c.kind === "has") {
        hit = valueHits(c.values, (v) => {
          if (v === "stat" || v === "scroll" || v === "scrolled") return !!h.stat;
          if (v === "title" || v === "p") return !!r.s.p;
          if (v === "level") return (r.s.level || 0) > 0;
          return false;
        });
      } else if (c.kind === "is") {
        hit = valueHits(c.values, (v) => {
          if (v === "sell" || v === "sale" || v === "selling") return !r.s.b;
          if (v === "buy" || v === "want" || v === "wanted" || v === "buying")
            return !!r.s.b;
          if (v === "near")
            return r.status === "inRange" || r.status === "sameMap";
          if (v === "afford") return !!r.s.b || (r.s.price || 0) <= OBS.gold;
          if (v === "have") return BAG.some((b) => b.name === r.s.name);
          if (v === "titled" || v === "title") return !!r.s.p;
          if (v === "stat" || v === "scrolled") return !!h.stat;
          if (v === "nostat" || v === "unscrolled") {
            return itemScrollable(r.s.name) && !h.stat;
          }
          if (v === "scrollable") return itemScrollable(r.s.name);
          return false;
        });
      }
      return c.negate ? !hit : hit;
    }

    function offerMatchesClauses(r, groups) {
      if (!groups || !groups.length) return true;
      const h = offerHaystack(r);
      for (let g = 0; g < groups.length; g++) {
        const clauses = groups[g];
        let ok = true;
        for (let i = 0; i < clauses.length; i++) {
          if (!offerMatchesClause(r, clauses[i], h)) {
            ok = false;
            break;
          }
        }
        if (ok) return true;
      }
      return false;
    }

    function syncTogglesFromQuery(raw) {
      const groups = parseMarketQuery(raw);
      let facet = "all";
      let near = false;
      let afford = false;
      let have = false;
      for (let g = 0; g < groups.length; g++) {
        const clauses = groups[g];
        for (let i = 0; i < clauses.length; i++) {
          const c = clauses[i];
          if (c.kind !== "is" || c.negate) continue;
          const vals = c.values || [];
          for (let j = 0; j < vals.length; j++) {
            const v = String(vals[j] || "").toLowerCase();
            if (v === "sell" || v === "sale" || v === "selling") facet = "sale";
            if (
              v === "buy" ||
              v === "want" ||
              v === "wanted" ||
              v === "buying"
            )
              facet = "wanted";
            if (v === "near") near = true;
            if (v === "afford") afford = true;
            if (v === "have") have = true;
          }
        }
      }
      state.facet = facet;
      state.nearOnly = near;
      state.canAfford = afford;
      state.haveStock = have;
    }

    function rewriteIsInFilter(next) {
      const tokens = tokenizeQuery(state.filter);
      const keep = [];
      for (let i = 0; i < tokens.length; i++) {
        let tok = tokens[i];
        let neg = "";
        if (tok.charAt(0) === "-") {
          neg = "-";
          tok = tok.slice(1);
        }
        const m = /^is:(.*)$/i.exec(tok);
        if (!m) {
          keep.push(tokens[i]);
          continue;
        }
        const v = String(m[1] || "").toLowerCase();
        if (
          v === "sell" ||
          v === "sale" ||
          v === "selling" ||
          v === "buy" ||
          v === "want" ||
          v === "wanted" ||
          v === "buying" ||
          v === "near" ||
          v === "afford" ||
          v === "have"
        ) {
          continue;
        }
        keep.push(neg + tok);
      }
      if (next.facet === "sale") keep.push("is:sell");
      if (next.facet === "wanted") keep.push("is:buy");
      if (next.nearOnly) keep.push("is:near");
      if (next.canAfford) keep.push("is:afford");
      if (next.haveStock) keep.push("is:have");
      state.filter = keep.join(" ").trim();
      state.facet = next.facet;
      state.nearOnly = next.nearOnly;
      state.canAfford = next.canAfford;
      state.haveStock = next.haveStock;
    }

    function itemFilterToken(name, extra) {
      const id = String(name || "");
      const disp = label(id, extra || { name: id });
      const use = disp && disp.toLowerCase() !== id.toLowerCase() ? disp : id;
      if (/[\s":]/.test(use)) {
        return 'item:"' + String(use).replace(/"/g, "") + '"';
      }
      return "item:" + use;
    }

    function rewriteItemInFilter(name, extra) {
      const tokens = tokenizeQuery(state.filter);
      const keep = [];
      for (let i = 0; i < tokens.length; i++) {
        let tok = tokens[i];
        if (tok.charAt(0) === "-") tok = tok.slice(1);
        if (/^item:/i.test(tok)) continue;
        keep.push(tokens[i]);
      }
      if (name) keep.unshift(itemFilterToken(name, extra));
      state.filter = keep.join(" ").trim();
    }

    function trailingOpContext(raw) {
      const s = String(raw || "");
      const m =
        /(^|\s)(-?)(item|merchant|mer|title|stat|attr|has|is|level|price|map|server):([^\s]*)$/i.exec(
          s,
        );
      if (!m) return null;
      return {
        op: m[3].toLowerCase() === "mer" ? "merchant" : m[3].toLowerCase(),
        value: m[4] || "",
        negate: !!m[2],
        start: m.index + m[1].length,
      };
    }

    function uniqueSorted(list) {
      const seen = {};
      const out = [];
      for (let i = 0; i < list.length; i++) {
        const v = list[i];
        if (!v || seen[v]) continue;
        seen[v] = true;
        out.push(v);
      }
      out.sort((a, b) => a.localeCompare(b));
      return out;
    }

    function marketItemNames() {
      return uniqueSorted(
        allOffers().map((r) => label(r.s.name, r.s)),
      );
    }
    function marketMerchantNames() {
      return uniqueSorted(allOffers().map((r) => r.mer.name));
    }
    function marketMaps() {
      return uniqueSorted(allOffers().map((r) => r.mer.map).filter(Boolean));
    }
    function marketServers() {
      return uniqueSorted(
        allOffers().map((r) => serverUi(r.mer.server)).filter(Boolean),
      );
    }
    function marketTitles() {
      return uniqueSorted(
        allOffers()
          .map((r) => window.MarketItemIcons.itemTitleLabel(r.s))
          .filter(Boolean),
      );
    }
    function marketTitleKeys() {
      return uniqueSorted(
        allOffers()
          .map((r) => (r.s && r.s.p ? String(r.s.p) : ""))
          .filter(Boolean),
      );
    }
    function marketStatTypes() {
      return uniqueSorted(
        allOffers()
          .map((r) => (r.s && r.s.stat_type ? String(r.s.stat_type) : ""))
          .filter(Boolean),
      );
    }

    function applySearchSuggestion(row) {
      const q = state.filter;
      const ctx = trailingOpContext(q);
      if (row.kind === "value" && ctx) {
        const before = q.slice(0, ctx.start);
        const neg = ctx.negate ? "-" : "";
        state.filter = (before + neg + ctx.op + ":" + row.value + " ").replace(
          /\s+/g,
          " ",
        );
      } else if (row.insert != null) {
        const trimmed = q.replace(/\s+$/, "");
        const needsSpace = trimmed && !/:$/.test(trimmed);
        state.filter = trimmed + (needsSpace ? " " : "") + row.insert;
      }
      syncTogglesFromQuery(state.filter);
      state.searchOpen = true;
      state.searchHi = 0;
    }

    function buildSearchSuggestions() {
      const q = state.filter;
      const ctx = trailingOpContext(q);
      const sections = [];
      const flat = [];

      function pushSec(title, rows) {
        if (!rows.length) return;
        sections.push({ title, rows });
        for (let i = 0; i < rows.length; i++) flat.push(rows[i]);
      }

      if (ctx && ctx.op === "is" && !ctx.value.includes(" ")) {
        const opts = [
          { value: "sell", hint: "Selling offers only" },
          { value: "buy", hint: "Buy orders only" },
          { value: "near", hint: "Same map / in range" },
          { value: "afford", hint: "Within your gold" },
          { value: "have", hint: "Items you hold" },
          { value: "titled", hint: "Has an item title" },
          { value: "stat", hint: "Stat scroll applied" },
          { value: "nostat", hint: "Scrollable, no scroll yet" },
          { value: "scrollable", hint: "Can take a stat scroll" },
        ];
        const needle = ctx.value.toLowerCase();
        pushSec(
          "Refine your search: is",
          opts
            .filter((o) => !needle || o.value.indexOf(needle) === 0)
            .map((o) => ({
              kind: "value",
              value: o.value,
              label: "is:" + o.value,
              hint: o.hint,
              ico: "▹",
            })),
        );
      } else if (ctx && ctx.op === "has" && !ctx.value.includes(" ")) {
        const opts = [
          { value: "stat", hint: "Has a stat scroll" },
          { value: "title", hint: "Has a title prefix" },
          { value: "level", hint: "Upgraded / compounded" },
        ];
        const needle = ctx.value.toLowerCase();
        pushSec(
          "Refine your search: has",
          opts
            .filter((o) => !needle || o.value.indexOf(needle) === 0)
            .map((o) => ({
              kind: "value",
              value: o.value,
              label: "has:" + o.value,
              hint: o.hint,
              ico: "▹",
            })),
        );
      } else if (ctx && ctx.op === "stat") {
        const needle = ctx.value.toLowerCase();
        const opts = [
          { value: "str", hint: "Strength scroll" },
          { value: "int", hint: "Intelligence scroll" },
          { value: "dex", hint: "Dexterity scroll" },
          { value: "vit", hint: "Vitality scroll" },
          { value: "none", hint: "No scroll applied" },
          { value: "any", hint: "Any scroll applied" },
        ];
        const fromData = marketStatTypes();
        const pool = uniqueSorted(
          opts.map((o) => o.value).concat(fromData),
        );
        const rows = [];
        for (let i = 0; i < pool.length && rows.length < 10; i++) {
          const name = pool[i];
          if (needle && name.indexOf(needle) < 0) continue;
          const hint =
            (opts.find((o) => o.value === name) || {}).hint || "stat scroll";
          rows.push({
            kind: "value",
            value: name,
            label: "stat:" + name,
            hint,
            ico: "✦",
          });
        }
        pushSec("Refine your search: stat", rows);
      } else if (ctx && ctx.op === "attr") {
        const needle = ctx.value.toLowerCase();
        const samples = [
          { value: "str", hint: "Strength > 0" },
          { value: "int>=10", hint: "Intelligence 10+" },
          { value: "armor>=50", hint: "Armor 50+" },
          { value: "lifesteal", hint: "Any lifesteal" },
          { value: "crit>0", hint: "Has crit" },
          { value: "hp>=500", hint: "HP 500+" },
        ];
        pushSec(
          "Refine your search: attr",
          samples
            .filter((o) => !needle || o.value.indexOf(needle) === 0)
            .map((o) => ({
              kind: "value",
              value: o.value,
              label: "attr:" + o.value,
              hint: o.hint,
              ico: "▹",
            })),
        );
      } else if (
        ctx &&
        (ctx.op === "merchant" ||
          ctx.op === "item" ||
          ctx.op === "title" ||
          ctx.op === "map" ||
          ctx.op === "server")
      ) {
        const needle = ctx.value.toLowerCase();
        let pool = [];
        if (ctx.op === "merchant") pool = marketMerchantNames();
        else if (ctx.op === "item") pool = marketItemNames();
        else if (ctx.op === "title") {
          pool = uniqueSorted(marketTitles().concat(marketTitleKeys()));
        } else if (ctx.op === "map") pool = marketMaps();
        else pool = marketServers();
        const rows = [];
        for (let i = 0; i < pool.length && rows.length < 8; i++) {
          const name = pool[i];
          if (needle && name.toLowerCase().indexOf(needle) < 0) continue;
          const needsQuote = /\s/.test(name);
          rows.push({
            kind: "value",
            value: needsQuote ? '"' + name + '"' : name,
            label: name,
            hint: ctx.op,
            ico: ctx.op === "merchant" ? "◆" : ctx.op === "title" ? "✦" : "▣",
          });
        }
        pushSec("Refine your search: " + ctx.op, rows);
      } else if (ctx && (ctx.op === "price" || ctx.op === "level")) {
        const samples =
          ctx.op === "price"
            ? [
                { value: "<1M", hint: "Under 1M" },
                { value: ">=10M", hint: "10M or more" },
                { value: "<=100k", hint: "100k or less" },
              ]
            : [
                { value: ">=7", hint: "Level 7+" },
                { value: "9", hint: "Exactly +9" },
                { value: "<=5", hint: "Level 5 or less" },
              ];
        pushSec(
          "Refine your search: " + ctx.op,
          samples.map((o) => ({
            kind: "value",
            value: o.value,
            label: ctx.op + ":" + o.value,
            hint: o.hint,
            ico: "▹",
          })),
        );
      } else {
        pushSec("Refine your search", [
          {
            kind: "op",
            insert: "item:",
            label: "item:",
            hint: "Filter by item",
            ico: "+",
          },
          {
            kind: "op",
            insert: "merchant:",
            label: "merchant:",
            hint: "Filter by merchant",
            ico: "+",
          },
          {
            kind: "op",
            insert: "title:",
            label: "title:",
            hint: "shiny · lucky · glitched…",
            ico: "+",
          },
          {
            kind: "op",
            insert: "stat:",
            label: "stat:",
            hint: "dex · int · none · any",
            ico: "+",
          },
          {
            kind: "op",
            insert: "attr:",
            label: "attr:",
            hint: "e.g. attr:armor>=50",
            ico: "+",
          },
          {
            kind: "op",
            insert: "has:",
            label: "has:",
            hint: "stat · title · level",
            ico: "+",
          },
          {
            kind: "op",
            insert: "is:",
            label: "is:",
            hint: "sell · buy · near · nostat · titled",
            ico: "+",
          },
          {
            kind: "op",
            insert: "price:",
            label: "price:",
            hint: "e.g. price:<1M",
            ico: "+",
          },
          {
            kind: "op",
            insert: "level:",
            label: "level:",
            hint: "e.g. level:>=7",
            ico: "+",
          },
          {
            kind: "op",
            insert: "map:",
            label: "map:",
            hint: "Filter by map",
            ico: "+",
          },
          {
            kind: "op",
            insert: "server:",
            label: "server:",
            hint: "Filter by server",
            ico: "+",
          },
        ]);
        const needle = q.trim().toLowerCase();
        if (needle && !trailingOpContext(q)) {
          const items = [];
          const names = marketItemNames();
          for (let i = 0; i < names.length && items.length < 5; i++) {
            if (names[i].toLowerCase().indexOf(needle) < 0) continue;
            items.push({
              kind: "op",
              insert: 'item:"' + names[i] + '" ',
              label: names[i],
              hint: "item",
              ico: "▣",
            });
          }
          pushSec("Items", items);
          const mers = [];
          const mnames = marketMerchantNames();
          for (let i = 0; i < mnames.length && mers.length < 5; i++) {
            if (mnames[i].toLowerCase().indexOf(needle) < 0) continue;
            mers.push({
              kind: "op",
              insert: "merchant:" + mnames[i] + " ",
              label: mnames[i],
              hint: "merchant",
              ico: "◆",
            });
          }
          pushSec("Merchants", mers);
          const titles = [];
          const tnames = uniqueSorted(marketTitles().concat(marketTitleKeys()));
          for (let i = 0; i < tnames.length && titles.length < 5; i++) {
            if (tnames[i].toLowerCase().indexOf(needle) < 0) continue;
            titles.push({
              kind: "op",
              insert: "title:" + tnames[i] + " ",
              label: tnames[i],
              hint: "title",
              ico: "✦",
            });
          }
          pushSec("Titles", titles);
        }
      }
      return { sections, flat };
    }

    function renderSearchMenu() {
      if (!state.searchOpen) return "";
      const { sections, flat } = buildSearchSuggestions();
      if (!sections.length) return "";
      if (state.searchHi >= flat.length) state.searchHi = Math.max(0, flat.length - 1);
      let hi = 0;
      const body = sections
        .map((sec) => {
          const rows = sec.rows
            .map((row) => {
              const idx = hi++;
              const isHi = idx === state.searchHi ? " is-hi" : "";
              return `<button type="button" class="search-menu__row${isHi}" data-act="search-pick" data-i="${idx}">
                <span class="search-menu__ico">${esc(row.ico || "·")}</span>
                ${
                  row.kind === "op" && row.label.indexOf(":") === row.label.length - 1
                    ? `<span class="search-menu__op">${esc(row.label)}</span>`
                    : `<span class="search-menu__label">${esc(row.label)}</span>`
                }
                <span class="search-menu__hint">${esc(row.hint || "")}</span>
              </button>`;
            })
            .join("");
          return `<div class="search-menu__sec"><div class="search-menu__h">${esc(
            sec.title,
          )}</div>${rows}</div>`;
        })
        .join("");
      return `<div class="search-menu" data-search-menu>
        ${body}
        <div class="search-menu__foot">Words AND · OR / | · stat:dex · attr:str>=10 · -has:stat · Quotes. <kbd>↵</kbd></div>
      </div>`;
    }
    function serverUi(s) {
      if (!s) return "?";
      const raw = String(s).replace(/^SR_/i, "");
      // EUI → EU I, USIII → US III, ASIAI → ASIA I
      const m = raw.match(/^([A-Z]+?)(I[IVX]*|V|X)?$/i);
      if (m && m[2]) return m[1].toUpperCase() + " " + m[2].toUpperCase();
      return raw;
    }
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("is-on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("is-on"), 1600);
    }
    function ico(name, opts) {
      return window.MarketItemIcons.itemIconHtml(name, Object.assign({ size: 40 }, opts || {}));
    }
    function label(name, opts) {
      return window.MarketItemIcons.itemLabel(name, opts);
    }

    /** Rough stock-like item props for mockup attr: search (not a full AL port). */
    const ATTR_KEYS = [
      "str", "int", "dex", "vit", "for", "hp", "mp", "armor", "resistance",
      "attack", "range", "speed", "evasion", "reflection", "lifesteal",
      "manasteal", "crit", "critdamage", "rpiercing", "apiercing", "dreturn",
      "frequency", "gold", "luck", "xp", "output", "stat", "courage",
      "mcourage", "pcourage", "pnresistance", "firesistance", "fzresistance",
      "phresistance", "stresistance", "stun", "miss", "mp_cost", "mp_reduction",
    ];
    const STAT_MULT = {
      gold: 0.5, luck: 1, xp: 0.5, int: 1, str: 1, dex: 1, vit: 1, for: 1,
      armor: 2.25, resistance: 2.25, speed: 0.325, evasion: 0.325,
      reflection: 0.15, lifesteal: 0.15, manasteal: 0.04, rpiercing: 2.25,
      apiercing: 2.25, crit: 0.125, dreturn: 0.5, frequency: 0.325,
      mp_cost: -0.6, output: 0.175,
    };

    function calcOfferProps(s) {
      const def =
        (window.MarketItemAssets &&
          window.MarketItemAssets.items &&
          window.MarketItemAssets.items[s.name]) ||
        {};
      const prop = {};
      for (let i = 0; i < ATTR_KEYS.length; i++) prop[ATTR_KEYS[i]] = 0;
      for (let i = 0; i < ATTR_KEYS.length; i++) {
        const k = ATTR_KEYS[i];
        if (typeof def[k] === "number") prop[k] += def[k];
      }
      const level = Math.max(0, Math.floor(Number(s.level) || 0));
      const up = def.upgrade || {};
      for (let i = 1; i <= level; i++) {
        const keys = Object.keys(up);
        for (let j = 0; j < keys.length; j++) {
          const k = keys[j];
          if (typeof up[k] !== "number") continue;
          if (prop[k] == null) prop[k] = 0;
          prop[k] += up[k];
          if (k === "stat" && i >= 7) prop.stat += 1;
        }
      }
      if (s.p === "shiny") {
        if (def.attack) prop.attack += 4;
        else if (def.stat) prop.stat += 2;
        else if (def.armor) {
          prop.armor += 12;
          prop.resistance += 10;
        } else {
          prop.dex += 1;
          prop.int += 1;
          prop.str += 1;
        }
      }
      const st = s.stat_type ? String(s.stat_type).toLowerCase() : "";
      if (def.stat && st && prop.stat) {
        const m = STAT_MULT[st] != null ? STAT_MULT[st] : 1;
        prop[st] = (prop[st] || 0) + prop.stat * m;
        prop.stat = 0;
      }
      return prop;
    }

    function itemScrollable(name) {
      const def =
        (window.MarketItemAssets &&
          window.MarketItemAssets.items &&
          window.MarketItemAssets.items[name]) ||
        {};
      return !!(def.scroll || def.stat);
    }

    /** Mirrors tradeSlots.merchantStandCapacity for merchants. */
    function standCapacity(entity) {
      const level = (entity && entity.level) || 0;
      const stand = entity && entity.stand ? String(entity.stand) : "";
      let tier = 16;
      if (level >= 80) tier = 30;
      else if (level >= 70 || stand === "cstand") tier = 24;
      const keys = Object.keys((entity && entity.slots) || {});
      let max = 0;
      for (let i = 0; i < keys.length; i++) {
        if (keys[i].indexOf("trade") !== 0) continue;
        const n = parseInt(keys[i].replace("trade", ""), 10);
        if (n > max) max = n;
      }
      return max > tier ? max : tier;
    }

    function standGridColumns(n) {
      return n > 16 ? 6 : 4;
    }

    /** Compact: filled + one empty (TradeGrid default). */
    function standSlotNames(entity, compact) {
      const n = standCapacity(entity);
      const all = [];
      for (let i = 1; i <= n; i++) all.push("trade" + i);
      if (!compact) return all;
      const slots = entity.slots || {};
      const filled = [];
      let firstEmpty = null;
      for (let i = 0; i < all.length; i++) {
        const k = all[i];
        if (slots[k] && slots[k].name) filled.push(k);
        else if (!firstEmpty) firstEmpty = k;
      }
      if (firstEmpty) filled.push(firstEmpty);
      return filled;
    }

    function offerFingerprint(r) {
      const s = r.s;
      return [
        r.mer.name,
        s.name,
        s.b ? "b" : "s",
        s.price || 0,
        s.level || 0,
        s.p || "",
      ].join("|");
    }

    /** Same merchant + item + side + price (+level/title) → one row. */
    function collapseOffers(list) {
      const map = {};
      const order = [];
      for (let i = 0; i < list.length; i++) {
        const r = list[i];
        const fp = offerFingerprint(r);
        if (!map[fp]) {
          map[fp] = {
            key: r.key,
            keys: [r.key],
            mer: r.mer,
            status: r.status,
            slotName: r.slotName,
            s: r.s,
            count: 1,
            totalQ: sQty(r.s),
          };
          order.push(fp);
        } else {
          const g = map[fp];
          g.keys.push(r.key);
          g.count += 1;
          g.totalQ += sQty(r.s);
        }
      }
      return order.map((fp) => map[fp]);
    }

    function sQty(s) {
      return s && s.q != null && s.q > 0 ? s.q : 1;
    }

    function itemMeta(name) {
      const assets = window.MarketItemAssets;
      return (assets && assets.items && assets.items[name]) || {};
    }

    function isStackable(s) {
      if (!s || !s.name) return false;
      if (s.q != null) return true;
      const t = itemMeta(s.name).type || "";
      return STACK_TYPES.has(t);
    }

    function bagHaveQ(name) {
      let n = 0;
      for (let i = 0; i < BAG.length; i++) {
        if (BAG[i].name === name) n += BAG[i].q || 1;
      }
      return n;
    }

    function offerAvailQ(r) {
      if (!r) return 0;
      if (r.totalQ != null) return r.totalQ;
      return sQty(r.s);
    }

    function rowWantQty(r) {
      const max = offerAvailQ(r);
      const saved = state.qtyByKey[r.key];
      let q = saved != null ? saved : 1;
      if (q < 1) q = 1;
      if (q > max) q = max;
      return q;
    }

    function setRowWantQty(key, raw, max) {
      let q = parseInt(raw, 10);
      if (!Number.isFinite(q) || q < 1) q = 1;
      if (max != null && q > max) q = max;
      state.qtyByKey[key] = q;
      return q;
    }

    function distSq(a, b) {
      const dx = (a.x || 0) - (b.x || 0);
      const dy = (a.y || 0) - (b.y || 0);
      return dx * dx + dy * dy;
    }

    function distPx(a, b) {
      return Math.round(Math.sqrt(distSq(a, b)));
    }

    function merchantStatus(mer) {
      if (mer.server !== OBS.server) return "otherServer";
      if (mer.map !== OBS.map) return "sameServer";
      if (distSq(mer, OBS) <= 200 * 200) return "inRange";
      return "sameMap";
    }

    /** Always include server; add map / distance when useful. */
    function whereShort(mer, status) {
      const parts = [serverUi(mer.server)];
      if (status === "inRange" || status === "sameMap") {
        parts.push(distPx(mer, OBS) + " away");
      } else if (status === "sameServer") {
        if (mer.map) parts.push(mer.map);
      } else if (mer.map) {
        parts.push(mer.map);
      }
      return parts.filter(Boolean).join(" · ");
    }

    function allOffers() {
      const out = [];
      for (let i = 0; i < state.chars.length; i++) {
        const mer = state.chars[i];
        const status = merchantStatus(mer);
        const slots = mer.slots || {};
        const keys = Object.keys(slots);
        for (let j = 0; j < keys.length; j++) {
          const key = keys[j];
          if (!key.startsWith("trade")) continue;
          const s = slots[key];
          if (!s || !s.name) continue;
          const offerKey = mer.name + ":" + key;
          if (state.consumedKeys[offerKey]) continue;
          out.push({
            key: offerKey,
            mer,
            status,
            slotName: key,
            s,
          });
        }
      }
      return out;
    }

    function filteredOffers() {
      let list = allOffers();
      const clauses = parseMarketQuery(state.filter);
      if (clauses.length) {
        list = list.filter((r) => offerMatchesClauses(r, clauses));
      }
      if (state.facet === "sale") list = list.filter((r) => !r.s.b);
      if (state.facet === "wanted") list = list.filter((r) => !!r.s.b);
      if (state.nearOnly) {
        list = list.filter(
          (r) => r.status === "inRange" || r.status === "sameMap",
        );
      }
      if (state.canAfford) {
        list = list.filter((r) => r.s.b || (r.s.price || 0) <= OBS.gold);
      }
      if (state.haveStock) {
        list = list.filter((r) => BAG.some((b) => b.name === r.s.name));
      }
      list.sort((a, b) => {
        const la = label(a.s.name, a.s);
        const lb = label(b.s.name, b.s);
        if (la !== lb) return la.localeCompare(lb);
        if (!!a.s.b !== !!b.s.b) return a.s.b ? 1 : -1;
        return a.s.b
          ? (b.s.price || 0) - (a.s.price || 0)
          : (a.s.price || 0) - (b.s.price || 0);
      });
      return list;
    }

    function itemGroupKey(s) {
      if (!s || !s.name) return "";
      return (
        s.name +
        "::" +
        (s.p || "") +
        "::" +
        (s.stat_type || "")
      );
    }
    function parseItemGroupKey(key) {
      const raw = String(key || "");
      const parts = raw.split("::");
      return {
        name: parts[0] || "",
        p: parts[1] || "",
        stat_type: parts[2] || "",
      };
    }
    function offerMatchesGroupKey(r, key) {
      const g = parseItemGroupKey(key);
      if (!g.name || r.s.name !== g.name) return false;
      if (String(r.s.p || "") !== g.p) return false;
      return String(r.s.stat_type || "") === g.stat_type;
    }

    function grouped(list) {
      const map = {};
      const order = [];
      for (let i = 0; i < list.length; i++) {
        const r = list[i];
        const k = itemGroupKey(r.s);
        if (!map[k]) {
          map[k] = [];
          order.push(k);
        }
        map[k].push(r);
      }
      return order.map((k) => ({ key: k, rows: map[k] }));
    }

    function findOfferByKey(key) {
      if (!key) return null;
      const raw = allOffers().find((x) => x.key === key);
      if (!raw) return null;
      const group = collapseOffers(
        allOffers().filter((r) => offerFingerprint(r) === offerFingerprint(raw)),
      )[0];
      return group || Object.assign({ count: 1, keys: [raw.key], totalQ: sQty(raw.s) }, raw);
    }

    function selectedOffer() {
      return state.offerKey ? findOfferByKey(state.offerKey) : null;
    }

    function actionLabel(r) {
      if (!r) return "";
      if (r.s.b) return "Sell";
      if ((r.s.price || 0) > OBS.gold) return "Can't afford";
      if (r.status === "otherServer" || r.status === "sameServer") return "Travel";
      if (r.status === "sameMap") return "Move closer";
      return "Buy";
    }

    function actionDisabled(r, qty) {
      if (!r) return true;
      const n = qty != null ? qty : rowWantQty(r);
      if (r.s.b) {
        return bagHaveQ(r.s.name) < n;
      }
      return (r.s.price || 0) * n > OBS.gold;
    }

    function consumeSlotQty(offerKey, take) {
      const raw = allOffers().find((x) => x.key === offerKey);
      if (!raw) return 0;
      const have = sQty(raw.s);
      const n = Math.min(have, take);
      if (n <= 0) return 0;
      if (isStackable(raw.s) && raw.s.q != null) {
        raw.s.q -= n;
        if (raw.s.q <= 0) state.consumedKeys[offerKey] = true;
      } else {
        state.consumedKeys[offerKey] = true;
      }
      return n;
    }

    function applyGoldBag(r, taken) {
      const unit = r.s.price || 0;
      if (r.s.b) {
        OBS.gold += unit * taken;
        let left = taken;
        for (let i = 0; i < BAG.length && left > 0; i++) {
          if (BAG[i].name !== r.s.name) continue;
          const use = Math.min(BAG[i].q || 1, left);
          BAG[i].q = (BAG[i].q || 1) - use;
          left -= use;
        }
        for (let i = BAG.length - 1; i >= 0; i--) {
          if ((BAG[i].q || 0) <= 0) BAG.splice(i, 1);
        }
      } else {
        OBS.gold -= unit * taken;
      }
    }

    function doAction(r, opts) {
      opts = opts || {};
      if (!r) return false;
      const buyAll = !!opts.all;
      let qty = buyAll
        ? offerAvailQ(r)
        : opts.qty != null
          ? opts.qty
          : rowWantQty(r);
      if (qty < 1) qty = 1;

      if (r.status !== "inRange") {
        state.travel = r.key;
        state.flashKey = r.key;
        toast("Traveling to " + r.mer.name + "…");
        render();
        setTimeout(() => {
          r.mer.map = OBS.map;
          r.mer.server = OBS.server;
          r.mer.x = OBS.x + 20;
          r.mer.y = OBS.y;
          state.travel = null;
          toast("Arrived near " + r.mer.name);
          render();
        }, 700);
        return false;
      }

      if (actionDisabled(r, buyAll ? Math.min(qty, 1) : qty) && !buyAll) {
        toast(r.s.b ? "Not enough in bag" : "Can't afford");
        return false;
      }
      if (buyAll && actionDisabled(r, 1)) {
        toast(r.s.b ? "Not enough in bag" : "Can't afford");
        return false;
      }

      const keys = r.keys && r.keys.length ? r.keys : [r.key];
      let taken = 0;

      if (buyAll || (isStackable(r.s) && qty > 1)) {
        let left = qty;
        for (let i = 0; i < keys.length && left > 0; i++) {
          if (state.consumedKeys[keys[i]]) continue;
          const unitCost = r.s.price || 0;
          if (!r.s.b) {
            const maxByGold =
              unitCost > 0 ? Math.floor(OBS.gold / unitCost) : left;
            if (maxByGold <= 0) break;
            left = Math.min(left, maxByGold);
          } else {
            const have = bagHaveQ(r.s.name);
            if (have <= 0) break;
            left = Math.min(left, have);
          }
          const n = consumeSlotQty(keys[i], isStackable(r.s) ? left : 1);
          if (n) {
            applyGoldBag(r, n);
            taken += n;
            left -= n;
          }
        }
      } else {
        let hit = r.key;
        for (let i = 0; i < keys.length; i++) {
          if (!state.consumedKeys[keys[i]]) {
            hit = keys[i];
            break;
          }
        }
        const n = consumeSlotQty(hit, isStackable(r.s) ? qty : 1);
        if (n) {
          applyGoldBag(r, n);
          taken = n;
          state.flashKey = hit;
        }
      }

      if (!taken) {
        toast("Nothing left on that listing");
        render();
        return false;
      }
      state.flashKey = r.key;
      const verb = r.s.b ? "trade_sell" : "trade_buy";
      const plural =
        buyAll && !isStackable(r.s) ? taken + " slots" : "×" + taken;
      toast(verb + " → " + r.mer.name + " · " + plural);
      render();
      return true;
    }

    /** Next actionable deal: cheapest sale, or highest buy-order we can fill. */
    function nextBestDeal(rows, side) {
      const list = collapseOffers(rows).filter((r) => {
        if (side === "buy") return !r.s.b && !actionDisabled(r, 1);
        return !!r.s.b && !actionDisabled(r, 1);
      });
      if (!list.length) return null;
      list.sort((a, b) =>
        side === "buy"
          ? (a.s.price || 0) - (b.s.price || 0)
          : (b.s.price || 0) - (a.s.price || 0),
      );
      return list[0];
    }

    function tradeSlotButton(slotName, slot, opts) {
      const on = opts && opts.on ? " is-on" : "";
      const act = opts && opts.act;
      const size = (opts && opts.size) || 40;
      const emptyPx = size + 6;
      const data =
        opts && opts.data
          ? Object.keys(opts.data)
              .map((k) => ` data-${k}="${esc(opts.data[k])}"`)
              .join("")
          : "";
      if (!slot || !slot.name) {
        return (
          `<button type="button" class="comm-trade-slot${on}" data-act="${esc(
            act || "stand-empty",
          )}" data-slot="${esc(slotName)}"${data}>` +
          `<div class="slot-art"><div class="slot-empty" style="width:${emptyPx}px;height:${emptyPx}px">+</div></div>` +
          `</button>`
        );
      }
      const buy = !!slot.b;
      return (
        `<button type="button" class="comm-trade-slot is-filled${on}" data-act="${esc(
          act || "stand-slot",
        )}" data-slot="${esc(slotName)}" title="${esc(
          label(slot.name, slot),
        )}"${data}>` +
        `<div class="slot-art">` +
        `<span class="slot-badge${buy ? " is-buy" : ""}">${buy ? "B" : "S"}</span>` +
        ico(slot.name, { level: slot.level, q: slot.q, size }) +
        `</div>` +
        `<div class="slot-price">${fmt(slot.price)}</div>` +
        `</button>`
      );
    }

    function renderBag() {
      return `
        <div class="ph">Bag <em>${BAG.length} stacks</em></div>
        <div class="slot-grid">
          ${BAG.map((b) => {
            const on = state.bagName === b.name ? " is-on" : "";
            return (
              `<button type="button" class="comm-trade-slot${on}" data-act="bag" data-name="${esc(
                b.name,
              )}" title="${esc(label(b.name, b))}${
                b.q > 1 ? " ×" + b.q : ""
              }">` +
              `<div class="slot-art">${ico(b.name, {
                level: b.level,
                q: b.q,
                size: 40,
              })}</div>` +
              `</button>`
            );
          }).join("")}
        </div>
        <div class="you-acts">
          <button type="button" class="btn btn-sell" data-act="list-sale" ${
            state.bagName ? "" : "disabled"
          }>List</button>
          <button type="button" class="btn btn-ghost" data-act="wishlist">Buy order</button>
        </div>`;
    }

    function renderStand() {
      const capacity = standCapacity(YOU);
      const cols = standGridColumns(capacity);
      const keys = standSlotNames(YOU, state.standCompact);
      const filled = Object.keys(YOU.slots).filter(
        (k) => k.indexOf("trade") === 0 && YOU.slots[k] && YOU.slots[k].name,
      ).length;
      const free = capacity - filled;
      const space =
        free <= 0 ? filled + " listed" : free + " free · " + filled + " listed";
      return `
        <div class="ph">
          Stand <em>${esc(space)}</em>
          <span class="ph-tools">
            <span class="seg">
              <button type="button" data-act="stand-view" data-v="pack" class="${
                state.standCompact ? "is-on" : ""
              }">Pack</button>
              <button type="button" data-act="stand-view" data-v="all" class="${
                state.standCompact ? "" : "is-on"
              }">All</button>
            </span>
            <button type="button" class="btn btn-ghost" data-act="tog-stand">${
              YOU.standOpen ? "Close" : "Open"
            }</button>
          </span>
        </div>
        <div class="stand-bar">
          <span class="st ${YOU.standOpen ? "" : "off"}">${
            YOU.standOpen ? "Open" : "Closed"
          }</span>
          <span>${esc(YOU.map)} · ${esc(serverUi(YOU.server))} · ${capacity}</span>
        </div>
        <div class="slot-grid slot-grid--stand ${
          cols === 6 ? "cols-6" : ""
        }">
          ${keys
            .map((k) =>
              tradeSlotButton(k, YOU.slots[k], {
                on: state.standSlot === k,
                act: YOU.slots[k] ? "stand-slot" : "stand-empty",
                size: cols === 6 ? 34 : 40,
              }),
            )
            .join("")}
        </div>`;
    }

    function offerRow(r, opts) {
      const withAct = opts && opts.actions;
      const chips = [];
      if (r.status === "inRange") chips.push('<span class="chip near">near</span>');
      if (OBS.party.has(r.mer.name))
        chips.push('<span class="chip party">party</span>');
      if (OBS.friends.has(r.mer.name))
        chips.push('<span class="chip friend">friend</span>');
      const where = whereShort(r.mer, r.status);
      const avail = offerAvailQ(r);
      const stack = isStackable(r.s);
      const qtyParts = [];
      if (r.count > 1) qtyParts.push(r.count + " slots");
      if (stack && avail > 0) qtyParts.push("×" + avail);
      else if (!stack && r.s.q && r.s.q > 1) qtyParts.push("×" + r.s.q);
      const meta = [where].concat(qtyParts).filter(Boolean).join(" · ");
      const flash =
        state.flashKey === r.key ||
        (r.keys && r.keys.indexOf(state.flashKey) >= 0)
          ? " is-flash"
          : "";
      const want = rowWantQty(r);
      const disabled = actionDisabled(r, want);
      const lbl = state.travel === r.key ? "…" : actionLabel(r);
      const maxTake = r.s.b
        ? Math.min(avail, bagHaveQ(r.s.name) || avail)
        : avail;
      const canAll =
        withAct &&
        r.status === "inRange" &&
        ((r.count > 1 && !actionDisabled(r, 1)) ||
          (stack && maxTake > 1 && !actionDisabled(r, 1)));

      if (withAct) {
        const qtyMax = r.s.b
          ? Math.min(avail, Math.max(1, bagHaveQ(r.s.name)))
          : avail;
        const qtyCtrl = stack
          ? `<label class="qty-wrap">Qty
              <input type="number" min="1" max="${qtyMax}" step="1"
                data-bind-qty="${esc(r.key)}" value="${want}" />
            </label>`
          : `<span class="qty-wrap"></span>`;
        const allBtn = canAll
          ? `<button type="button" class="row-act is-all ${
              r.s.b ? "is-sell" : "is-buy"
            }" data-act="go-all" data-key="${esc(r.key)}" title="${esc(
              (r.s.b ? "Sell all" : "Buy all") +
                " · Shift+click also works",
            )}">All · ${stack ? "×" + maxTake : "×" + r.count}</button>`
          : "";
        const lineTotal =
          stack && want > 1
            ? `<span class="stack">= ${fmt((r.s.price || 0) * want)}</span>`
            : r.count > 1
              ? `<span class="stack">×${r.count}</span>`
              : "";
        const kindCell = opts.sideColumn
          ? ""
          : `<div class="kind ${r.s.b ? "wants" : "sells"}">${
              r.s.b ? "Wants" : "Sells"
            }</div>`;
        return `
          <div class="offer${flash}${
            disabled && r.status === "inRange" ? " is-blocked" : ""
          }">
            <div class="offer-main">
              ${kindCell}
              <div>
                <div class="who">${esc(r.mer.name)}${
                  chips.length
                    ? `<span class="chips">${chips.join("")}</span>`
                    : ""
                }</div>
                <div class="where">${esc(meta || " ")}</div>
              </div>
              <div class="price">${fmt(r.s.price)}${lineTotal}</div>
            </div>
            <div class="offer-ops">
              ${qtyCtrl}
              <button type="button" class="row-act is-primary ${
                r.s.b ? "is-sell" : "is-buy"
              }" data-act="go" data-key="${esc(r.key)}" ${
                disabled ? "disabled" : ""
              }>${esc(lbl)}</button>
              ${allBtn}
            </div>
          </div>`;
      }

      return `
        <button type="button" class="row" data-act="pick" data-key="${esc(
          r.key,
        )}">
          <div class="kind ${r.s.b ? "wants" : "sells"}">${
            r.s.b ? "Wants" : "Sells"
          }</div>
          <div>
            <div class="who">${esc(r.mer.name)}${
              chips.length ? `<span class="chips">${chips.join("")}</span>` : ""
            }</div>
            <div class="where">${esc(meta)}</div>
          </div>
          <div class="price">${fmt(r.s.price)}${
            r.count > 1
              ? `<span class="stack">×${r.count}</span>`
              : ""
          }</div>
        </button>`;
    }

    function itemGroupStats(rows) {
      const sales = rows.filter((r) => !r.s.b);
      const wants = rows.filter((r) => r.s.b);
      return {
        sales,
        wants,
        bestSale: sales.length
          ? Math.min(...sales.map((r) => r.s.price || 0))
          : null,
        bestWant: wants.length
          ? Math.max(...wants.map((r) => r.s.price || 0))
          : null,
      };
    }

    function renderOffersList(rows) {
      const collapsed = collapseOffers(rows);
      const groups = grouped(collapsed);
      return groups
        .map((g) => {
          const st = itemGroupStats(g.rows);
          const sample = g.rows[0].s;
          const rawCount = rows.filter((r) => offerMatchesGroupKey(r, g.key))
            .length;
          return `
            <details class="group" open>
              <summary>
                ${ico(sample.name, { level: sample.level, p: sample.p, size: 40 })}
                <div>
                  <div class="g-name">${esc(label(sample.name, sample))}</div>
                  <div class="g-sub">${st.sales.length} selling · ${
                    st.wants.length
                  } buying${
                    rawCount !== g.rows.length
                      ? " · " + rawCount + " slots"
                      : ""
                  }</div>
                </div>
                <div class="g-best">
                  ${
                    st.bestSale != null
                      ? `<span>low</span>${fmt(st.bestSale)}`
                      : st.bestWant != null
                        ? `<span>high</span>${fmt(st.bestWant)}`
                        : ""
                  }
                </div>
              </summary>
              ${g.rows.map(offerRow).join("")}
            </details>`;
        })
        .join("");
    }

    function renderMarketGrid(list) {
      const byItem = grouped(list);
      if (!byItem.length) {
        return `<div class="empty"><strong>Nothing matches</strong>Try clearing filters or search.</div>`;
      }
      // Prefer dual-sided items first so buy+sell examples are easy to find.
      byItem.sort((a, b) => {
        const sa = itemGroupStats(a.rows);
        const sb = itemGroupStats(b.rows);
        const da = (sa.sales.length && sa.wants.length ? 0 : 1);
        const db = (sb.sales.length && sb.wants.length ? 0 : 1);
        if (da !== db) return da - db;
        return label(a.rows[0].s.name, a.rows[0].s).localeCompare(
          label(b.rows[0].s.name, b.rows[0].s),
        );
      });
      const cards = byItem
        .map((g) => {
          const st = itemGroupStats(g.rows);
          const sample = g.rows[0].s;
          const on = state.gridItem === g.key ? " is-on" : "";
          const sellN = st.sales.length;
          const buyN = st.wants.length;
          const dual = sellN > 0 && buyN > 0;
          const low =
            st.bestSale != null
              ? `<div class="row-p"><span class="lbl">Sell</span><span class="val sell">${fmt(
                  st.bestSale,
                )}</span></div>`
              : `<div class="row-p"><span class="lbl">Sell</span><span class="val none">—</span></div>`;
          const high =
            st.bestWant != null
              ? `<div class="row-p"><span class="lbl">Buy</span><span class="val buy">${fmt(
                  st.bestWant,
                )}</span></div>`
              : `<div class="row-p"><span class="lbl">Buy</span><span class="val none">—</span></div>`;
          return `
            <button type="button" class="item-card${dual ? " is-dual" : ""}${on}" data-act="grid-item" data-name="${esc(
              g.key,
            )}">
              <div class="item-card__top">
                ${ico(sample.name, { level: sample.level, p: sample.p, size: 48 })}
                <div class="item-card__counts">
                  <span class="s${sellN ? "" : " dim"}">${sellN}S</span>
                  <span class="b${buyN ? "" : " dim"}">${buyN}B</span>
                </div>
              </div>
              <div class="nm">${esc(label(sample.name, sample))}</div>
              <div class="item-card__prices">${low}${high}</div>
            </button>`;
        })
        .join("");
      return `<div class="item-grid">${cards}</div>`;
    }

    function renderMarket() {
      const list = filteredOffers();
      const collapsedAll = collapseOffers(list);
      const viewSeg = `
          <span class="seg">
            <button type="button" data-act="view" data-v="grid" class="${
              state.view === "grid" ? "is-on" : ""
            }">Grid</button>
            <button type="button" data-act="view" data-v="list" class="${
              state.view === "list" ? "is-on" : ""
            }">List</button>
          </span>`;
      if (!list.length) {
        return `
          <div class="ph">Market <span class="ph-tools">${viewSeg}</span></div>
          <div class="empty"><strong>Nothing matches</strong>Try clearing filters or search.</div>`;
      }
      return `
        <div class="ph">
          Market
          <em>${collapsedAll.length} offers · ${list.length} slots</em>
          <span class="ph-tools">${viewSeg}</span>
        </div>
        ${
          state.view === "grid"
            ? renderMarketGrid(list)
            : `<div class="market-list">${renderOffersList(list)}</div>`
        }`;
    }

    function renderFocusOfferDetail(r) {
      const have = bagHaveQ(r.s.name);
      const where = whereShort(r.mer, r.status);
      const subParts = [
        r.s.b ? "Wants" : "Sells",
        r.mer.name,
        where,
      ].filter(Boolean);
      const avail = offerAvailQ(r);
      const stack = isStackable(r.s);
      const want = rowWantQty(r);
      const canAll =
        r.status === "inRange" &&
        ((r.count > 1 && !actionDisabled(r, 1)) ||
          (stack && avail > 1 && !actionDisabled(r, 1)));
      return `
        <div class="focus">
          <div class="focus-head">
            ${ico(r.s.name, { level: r.s.level, size: 48 })}
            <div>
              <h2>${esc(label(r.s.name, r.s))}</h2>
              <div class="sub">
                <span class="kind ${r.s.b ? "wants" : "sells"}">${
                  r.s.b ? "Wants" : "Sells"
                }</span>
                · ${esc(r.mer.name)}${where ? " · " + esc(where) : ""}
              </div>
            </div>
          </div>
          <div class="big">${fmt(r.s.price)}${
            r.count > 1
              ? ` <span style="font-size:13px;color:#777">×${r.count} slots</span>`
              : stack
                ? ` <span style="font-size:13px;color:#777">×${avail}</span>`
                : ""
          }</div>
          ${
            r.status !== "inRange"
              ? `<div class="hint">Out of range — travel first (${esc(
                  subParts.slice(2).join(" · "),
                )}).</div>`
              : ""
          }
          ${
            r.s.b && have < 1
              ? `<div class="hint warn">Not in your bag.</div>`
              : ""
          }
          <div class="acts">
            ${
              stack
                ? `<label class="qty-wrap">qty
                    <input type="number" min="1" max="${avail}" step="1"
                      data-bind-qty="${esc(r.key)}" value="${want}" />
                    <span>/ ${avail}</span>
                  </label>`
                : ""
            }
            <button type="button" class="btn ${
              r.s.b ? "btn-sell" : "btn-gold"
            }" data-act="go" data-key="${esc(r.key)}" ${

            }>${esc(
