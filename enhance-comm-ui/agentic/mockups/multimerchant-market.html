            ${
              canAll
                ? `<button type="button" class="btn btn-ghost" data-act="go-all" data-key="${esc(
                    r.key,
                  )}">${r.s.b ? "Sell all" : "Buy all"} · ${
                    stack ? "×" + avail : "×" + r.count
                  }</button>`
                : ""
            }
            ${
              !r.s.b
                ? `<button type="button" class="btn btn-ghost" data-act="mirror">Mirror buy order</button>`
                : have
                  ? `<button type="button" class="btn btn-ghost" data-act="undercut">Undercut list</button>`
                  : ""
            }
            <p class="hint" style="margin:4px 0 0;border:0;padding:0;background:transparent">Shift+click Buy/Sell takes all.</p>
          </div>
        </div>`;
    }

    function renderFocusGridItem(itemKey) {
      const rows = filteredOffers().filter((r) =>
        offerMatchesGroupKey(r, itemKey),
      );
      const collapsed = collapseOffers(rows);
      if (!rows.length) {
        return `
          <div class="ph">Focus</div>
          <div class="empty">No offers for this item<br/>with current filters.</div>`;
      }
      const sample = rows[0].s;
      const st = itemGroupStats(rows);
      const nextBuy = nextBestDeal(rows, "buy");
      const nextSell = nextBestDeal(rows, "sell");
      const sortSide = (list, wants) =>
        list.slice().sort((a, b) => {
          const da = actionDisabled(a, 1) ? 1 : 0;
          const db = actionDisabled(b, 1) ? 1 : 0;
          if (da !== db) return da - db;
          return wants
            ? (b.s.price || 0) - (a.s.price || 0)
            : (a.s.price || 0) - (b.s.price || 0);
        });
      const sales = sortSide(
        collapsed.filter((r) => !r.s.b),
        false,
      );
      const wants = sortSide(
        collapsed.filter((r) => r.s.b),
        true,
      );
      const sideOpts = { actions: true, sideColumn: true };
      const sellBody = sales.length
        ? sales.map((r) => offerRow(r, sideOpts)).join("")
        : `<div class="focus-col__empty">No sell offers</div>`;
      const wantBody = wants.length
        ? wants.map((r) => offerRow(r, sideOpts)).join("")
        : `<div class="focus-col__empty">No buy orders</div>`;

      return `
        <div class="ph">Focus <em>${collapsed.length} offers</em></div>
        <div class="focus focus-top">
          <div class="focus-head">
            ${ico(sample.name, { level: sample.level, p: sample.p, size: 40 })}
            <div>
              <h2>${esc(label(sample.name, sample))}</h2>
              <div class="sub">${st.sales.length} selling · ${
                st.wants.length
              } buying</div>
            </div>
          </div>
          <div class="deal-bar">
            <button type="button" class="btn btn-gold" data-act="deal-next" data-side="buy" ${
              nextBuy ? "" : "disabled"
            }>${
              nextBuy ? "Buy best · " + fmt(nextBuy.s.price) : "Buy best"
            }</button>
            <button type="button" class="btn btn-sell" data-act="deal-next" data-side="sell" ${
              nextSell ? "" : "disabled"
            }>${
              nextSell ? "Sell best · " + fmt(nextSell.s.price) : "Sell best"
            }</button>
            <p class="hint">${
              nextBuy
                ? esc(nextBuy.mer.name) + " sells @ " + esc(fmt(nextBuy.s.price))
                : "No buyable sales"
            } · ${
              nextSell
                ? esc(nextSell.mer.name) +
                  " wants @ " +
                  esc(fmt(nextSell.s.price))
                : bagHaveQ(sample.name)
                  ? "No buy orders"
                  : "Not in bag"
            }</p>
          </div>
        </div>
        <div class="focus-offers focus-offers--split">
          <div class="focus-col focus-col--sells">
            <div class="focus-col__h"><span class="lbl sells">Sells</span><em>${
              sales.length
            }</em></div>
            ${sellBody}
          </div>
          <div class="focus-col focus-col--wants">
            <div class="focus-col__h"><span class="lbl wants">Wants</span><em>${
              wants.length
            }</em></div>
            ${wantBody}
          </div>
        </div>`;
    }

    function renderFocus() {
      const r = selectedOffer();
      const standSlot =
        state.standSlot && YOU.slots[state.standSlot]
          ? YOU.slots[state.standSlot]
          : null;

      if (standSlot && !r) {
        return `
          <div class="ph">Focus</div>
          <div class="focus">
            <div class="focus-head">
              ${ico(standSlot.name, { level: standSlot.level, size: 48 })}
              <div>
                <h2>${esc(label(standSlot.name, standSlot))}</h2>
                <div class="sub">Your stand · ${esc(state.standSlot)} · ${
                  standSlot.b ? "buy order" : "for sale"
                }</div>
              </div>
            </div>
            <div class="big">${fmt(standSlot.price)}</div>
            <div class="acts">
              <button type="button" class="btn btn-ghost" data-act="unlist" data-slot="${esc(
                state.standSlot,
              )}">Remove</button>
            </div>
          </div>`;
      }

      // Grid: item focus stays on the offer list + next-best (no drill-in).
      if (state.view === "grid" && state.gridItem) {
        return renderFocusGridItem(state.gridItem);
      }

      if (r) {
        return `<div class="ph">Focus</div>${renderFocusOfferDetail(r)}`;
      }

      const bag = state.bagName && BAG.find((b) => b.name === state.bagName);
      if (bag) {
        const matches = allOffers().filter((o) => o.s.name === bag.name);
        return `
          <div class="ph">Focus</div>
          <div class="focus">
            <div class="focus-head">
              ${ico(bag.name, { level: bag.level, size: 48 })}
              <div>
                <h2>${esc(label(bag.name, bag))}</h2>
                <div class="sub">Bag · ×${bag.q} · ${matches.length} market rows</div>
              </div>
            </div>
            <div class="acts">
              <button type="button" class="btn btn-sell" data-act="list-sale">List on stand</button>
              ${
                matches.length
                  ? `<button type="button" class="btn btn-ghost" data-act="grid-item" data-name="${esc(
                      bag.name,
                    )}">See market offers</button>`
                  : ""
              }
            </div>
          </div>`;
      }

      return `
        <div class="ph">Focus</div>
        <div class="empty"><strong>No item selected</strong>${
          state.view === "grid"
            ? "Pick a card in the market grid."
            : "Pick a listing, bag stack, or stand slot."
        }</div>`;
    }

    function render() {
      stampEl.textContent = state.pulledAt
        ? new Date(state.pulledAt).toLocaleString()
        : "loading";
      root.innerHTML = `
        <div class="ecu-panel__head">
          <h1 class="ecu-panel__title">Market</h1>
          <div class="ecu-panel__pill">${fmt(OBS.gold)} gold</div>
        </div>
        <div class="market-tools">
          <div class="search-wrap">
            <div class="search">
              <span class="ico">⌕</span>
              <input data-bind="filter" placeholder="Search · item: · title: · stat: · attr:…" value="${esc(
                state.filter,
              )}" autocomplete="off" spellcheck="false" />
              ${
                state.filter
                  ? `<button type="button" class="clear" data-act="search-clear" title="Clear search" aria-label="Clear search">×</button>`
                  : ""
              }
            </div>
            ${renderSearchMenu()}
          </div>
          <div class="seg">
            <button type="button" data-act="facet" data-v="all" class="${
              state.facet === "all" ? "is-on" : ""
            }">All</button>
            <button type="button" data-act="facet" data-v="sale" class="${
              state.facet === "sale" ? "is-on" : ""
            }">Selling</button>
            <button type="button" data-act="facet" data-v="wanted" class="${
              state.facet === "wanted" ? "is-on" : ""
            }">Buying</button>
          </div>
          <div class="tog-row">
            <label class="tog"><input type="checkbox" data-bind="nearOnly" ${
              state.nearOnly ? "checked" : ""
            }/>Near</label>
            <label class="tog"><input type="checkbox" data-bind="canAfford" ${
              state.canAfford ? "checked" : ""
            }/>Afford</label>
            <label class="tog"><input type="checkbox" data-bind="haveStock" ${
              state.haveStock ? "checked" : ""
            }/>Have</label>
          </div>
        </div>
        <div class="market-body">
          <div class="you">
            <div class="you-bag">${renderBag()}</div>
            <div class="you-stand">${renderStand()}</div>
          </div>
          <div class="col col--market">${renderMarket()}</div>
          <div class="col col--focus">${renderFocus()}</div>
        </div>`;
    }

    function refocusSearch(start, end) {
      const input = root.querySelector('[data-bind="filter"]');
      if (!input) return;
      input.focus();
      try {
        const n = input.value.length;
        const a = start == null ? n : start;
        const b = end == null ? n : end;
        input.setSelectionRange(a, b);
      } catch (e) {}
    }

    /** Show refine menu without replacing the focused input (avoids click/focus loss). */
    function ensureSearchMenuDom() {
      const wrap = root.querySelector(".search-wrap");
      if (!wrap) return;
      const existing = wrap.querySelector(".search-menu");
      if (existing) existing.remove();
      const html = renderSearchMenu();
      if (html) wrap.insertAdjacentHTML("beforeend", html);
    }

    root.addEventListener("input", (ev) => {
      const t = ev.target;
      if (t.getAttribute("data-bind") === "filter") {
        state.filter = t.value;
        syncTogglesFromQuery(state.filter);
        state.searchOpen = true;
        state.searchHi = 0;
        // Keep caret; only refresh clear button + menu (full render steals the click/type cycle).
        const search = root.querySelector(".search");
        if (search) {
          let clear = search.querySelector('[data-act="search-clear"]');
          if (state.filter && !clear) {
            search.insertAdjacentHTML(
              "beforeend",
              `<button type="button" class="clear" data-act="search-clear" title="Clear search" aria-label="Clear search">×</button>`,
            );
          } else if (!state.filter && clear) {
            clear.remove();
          }
        }
        ensureSearchMenuDom();
        // Market/list still need a full pass when the query changes.
        const body = root.querySelector(".market-body");
        if (body) {
          const tools = root.querySelector(".market-tools");
          const facet = state.facet;
          const near = state.nearOnly;
          const afford = state.canAfford;
          const have = state.haveStock;
          // Sync facet/tog UI from query without nuking the input.
          if (tools) {
            const segBtns = tools.querySelectorAll(".seg [data-act=facet]");
            for (let i = 0; i < segBtns.length; i++) {
              const b = segBtns[i];
              const on = b.getAttribute("data-v") === facet;
              b.classList.toggle("is-on", on);
            }
            const nearEl = tools.querySelector('[data-bind=nearOnly]');
            const affordEl = tools.querySelector('[data-bind=canAfford]');
            const haveEl = tools.querySelector('[data-bind=haveStock]');
            if (nearEl) nearEl.checked = near;
            if (affordEl) affordEl.checked = afford;
            if (haveEl) haveEl.checked = have;
          }
          const you = body.querySelector(".you");
          const market = body.querySelector(".col--market");
          const focus = body.querySelector(".col--focus");
          if (you) you.innerHTML = `<div class="you-bag">${renderBag()}</div><div class="you-stand">${renderStand()}</div>`;
          if (market) market.innerHTML = renderMarket();
          if (focus) focus.innerHTML = renderFocus();
        }
      } else if (t.hasAttribute("data-bind-qty")) {
        const key = t.getAttribute("data-bind-qty");
        const max = parseInt(t.getAttribute("max"), 10);
        setRowWantQty(key, t.value, Number.isFinite(max) ? max : null);
        const row = t.closest(".offer") || t.closest(".focus");
        if (row) {
          const btn = row.querySelector('[data-act="go"]');
          const r = findOfferByKey(key);
          if (btn && r) {
            const want = rowWantQty(r);
            btn.disabled = actionDisabled(r, want);
            const priceEl = row.querySelector(".price .stack");
            if (isStackable(r.s)) {
              if (want > 1) {
                if (priceEl) {
                  priceEl.textContent = "= " + fmt((r.s.price || 0) * want);
                } else {
                  const price = row.querySelector(".price");
                  if (price) {
                    const span = document.createElement("span");
                    span.className = "stack";
                    span.textContent = "= " + fmt((r.s.price || 0) * want);
                    price.appendChild(span);
                  }
                }
              } else if (priceEl && !String(priceEl.textContent || "").startsWith("×")) {
                priceEl.remove();
              }
            }
          }
        }
      }
    });
    root.addEventListener("change", (ev) => {
      const t = ev.target;
      if (!(t instanceof HTMLInputElement)) return;
      const b = t.getAttribute("data-bind");
      if (b === "nearOnly" || b === "canAfford" || b === "haveStock") {
        rewriteIsInFilter({
          facet: state.facet,
          nearOnly: b === "nearOnly" ? t.checked : state.nearOnly,
          canAfford: b === "canAfford" ? t.checked : state.canAfford,
          haveStock: b === "haveStock" ? t.checked : state.haveStock,
        });
        render();
      }
    });

    root.addEventListener("focusin", (ev) => {
      const t = ev.target;
      if (t && t.getAttribute("data-bind") === "filter") {
        if (!state.searchOpen) {
          state.searchOpen = true;
          ensureSearchMenuDom();
        }
      }
    });

    root.addEventListener("pointerdown", (ev) => {
      if (!ev.target.closest(".search")) return;
      if (state.searchOpen) return;
      state.searchOpen = true;
      ensureSearchMenuDom();
    });

    root.addEventListener("keydown", (ev) => {
      const t = ev.target;
      if (!(t instanceof HTMLInputElement)) return;
      if (t.getAttribute("data-bind") !== "filter") return;
      const { flat } = buildSearchSuggestions();
      if (ev.key === "Escape") {
        if (state.searchOpen) {
          state.searchOpen = false;
          ensureSearchMenuDom();
          ev.preventDefault();
        }
        return;
      }
      if (!state.searchOpen || !flat.length) return;
      if (ev.key === "ArrowDown") {
        state.searchHi = (state.searchHi + 1) % flat.length;
        ensureSearchMenuDom();
        ev.preventDefault();
      } else if (ev.key === "ArrowUp") {
        state.searchHi = (state.searchHi - 1 + flat.length) % flat.length;
        ensureSearchMenuDom();
        ev.preventDefault();
      } else if (ev.key === "Tab") {
        const row = flat[state.searchHi];
        if (!row) return;
        applySearchSuggestion(row);
        const input = root.querySelector('[data-bind="filter"]');
        if (input) input.value = state.filter;
        ensureSearchMenuDom();
        const search = root.querySelector(".search");
        if (search && state.filter && !search.querySelector('[data-act="search-clear"]')) {
          search.insertAdjacentHTML(
            "beforeend",
            `<button type="button" class="clear" data-act="search-clear" title="Clear search" aria-label="Clear search">×</button>`,
          );
        }
        // Refresh results without destroying input
        root.querySelector('[data-bind="filter"]')?.dispatchEvent(
          new Event("input", { bubbles: true }),
        );
        ev.preventDefault();
      } else if (ev.key === "Enter") {
        if (trailingOpContext(state.filter)) {
          const row = flat[state.searchHi];
          if (row) applySearchSuggestion(row);
          const input = root.querySelector('[data-bind="filter"]');
          if (input) input.value = state.filter;
        }
        state.searchOpen = false;
        ensureSearchMenuDom();
        root.querySelector('[data-bind="filter"]')?.dispatchEvent(
          new Event("input", { bubbles: true }),
        );
        ev.preventDefault();
      }
    });

    root.addEventListener("mousedown", (ev) => {
      const pick = ev.target.closest('[data-act="search-pick"]');
      if (!pick) return;
      ev.preventDefault();
      const { flat } = buildSearchSuggestions();
      const row = flat[parseInt(pick.getAttribute("data-i"), 10)];
      if (row) applySearchSuggestion(row);
      const input = root.querySelector('[data-bind="filter"]');
      if (input) {
        input.value = state.filter;
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.focus();
      }
    });

    document.addEventListener("mousedown", (ev) => {
      if (!state.searchOpen) return;
      const wrap = root.querySelector(".search-wrap");
      if (wrap && wrap.contains(ev.target)) return;
      // Opening the menu used to replace the input mid-click; ignore that ghost target.
      if (ev.target instanceof Node && !document.contains(ev.target)) return;
      state.searchOpen = false;
      ensureSearchMenuDom();
    });

    root.addEventListener("click", (ev) => {
      const t = ev.target.closest("[data-act]");
      if (!t) return;
      const act = t.getAttribute("data-act");
      if (act === "search-pick") {
        return;
      }
      if (act === "search-clear") {
        state.filter = "";
        state.bagName = null;
        syncTogglesFromQuery("");
        state.searchOpen = true;
        state.searchHi = 0;
        render();
        refocusSearch();
        return;
      }
      if (act === "facet") {
        rewriteIsInFilter({
          facet: t.getAttribute("data-v"),
          nearOnly: state.nearOnly,
          canAfford: state.canAfford,
          haveStock: state.haveStock,
        });
        render();
      } else if (act === "view") {
        state.view = t.getAttribute("data-v") === "list" ? "list" : "grid";
        render();
      } else if (act === "grid-item") {
        const name = t.getAttribute("data-name");
        state.gridItem = state.gridItem === name ? null : name;
        state.offerKey = null;
        state.bagName = null;
        state.standSlot = null;
        state.flashKey = null;
        render();
      } else if (act === "deal-next") {
        const side = t.getAttribute("data-side") === "sell" ? "sell" : "buy";
        if (!state.gridItem) return;
        const rows = filteredOffers().filter((r) =>
          offerMatchesGroupKey(r, state.gridItem),
        );
        const next = nextBestDeal(rows, side);
        if (!next) {
          toast(side === "buy" ? "No buyable deals left" : "No sell deals left");
          return;
        }
        doAction(next);
      } else if (act === "bag") {
        const name = t.getAttribute("data-name");
        if (state.bagName === name) {
          state.bagName = null;
          rewriteItemInFilter(null);
        } else {
          state.bagName = name;
          const bag = BAG.find((b) => b.name === name);
          // Bag pick owns the query: keep facet/near/afford/have, drop other terms.
          const keepToggles = {
            facet: state.facet,
            nearOnly: state.nearOnly,
            canAfford: state.canAfford,
            haveStock: state.haveStock,
          };
          state.filter = "";
          rewriteIsInFilter(keepToggles);
          rewriteItemInFilter(name, bag || { name });
        }
        state.offerKey = null;
        state.standSlot = null;
        state.gridItem = name;
        render();
      } else if (act === "pick") {
        state.offerKey = t.getAttribute("data-key");
        state.standSlot = null;
        state.bagName = null;
        const raw = allOffers().find((x) => x.key === state.offerKey);
        if (raw) state.gridItem = itemGroupKey(raw.s);
        render();
      } else if (act === "go" || act === "go-all") {
        const r = findOfferByKey(t.getAttribute("data-key"));
        const all = act === "go-all" || (act === "go" && ev.shiftKey);
        doAction(r, all ? { all: true } : {});
      } else if (act === "list-sale") {
        toast("List dialog (prototype)");
      } else if (act === "wishlist" || act === "mirror" || act === "undercut") {
        toast(act + " (prototype)");
      } else if (act === "stand-empty" || act === "stand-slot") {
        state.standSlot = t.getAttribute("data-slot");
        state.offerKey = null;
        render();
      } else if (act === "stand-view") {
        state.standCompact = t.getAttribute("data-v") !== "all";
        render();
      } else if (act === "tog-stand-compact") {
        state.standCompact = !state.standCompact;
        render();
      } else if (act === "tog-stand") {
        YOU.standOpen = !YOU.standOpen;
        YOU.stand = YOU.standOpen ? "stand0" : "";
        render();
      } else if (act === "unlist") {
        delete YOU.slots[t.getAttribute("data-slot")];
        state.standSlot = null;
        toast("Removed");
        render();
      }
    });

    function applyMerchantsPayload(payload) {
      const chars =
        (payload && payload.chars) ||
        (payload &&
          payload.infs &&
          (payload.infs.find((i) => i.type === "merchants") || {}).chars) ||
        [];
      state.chars = chars;
      state.pulledAt = payload.pulledAt || new Date().toISOString();
      render();
    }

    async function loadSample() {
      const bust = "v=" + Date.now();
      const [assets, merchants] = await Promise.all([
        fetch("data/market-item-assets.json?" + bust).then((r) => r.json()),
        fetch("data/pull-merchants-sample.json?" + bust).then((r) => r.json()),
      ]);
      window.MarketItemAssets = assets;
      applyMerchantsPayload(merchants);
      toast(merchants.chars.length + " merchants from sample");
    }

    async function refreshLive() {
      toast("pull_merchants…");
      try {
        const r = await fetch("https://adventure.land/api/pull_merchants", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        const data = await r.json();
        if (data.failed) {
          toast("Live pull failed: " + (data.reason || "auth"));
          return;
        }
        applyMerchantsPayload(data);
        toast("Live catalog refreshed");
      } catch (e) {
        toast("Live pull error");
      }
    }

    document.getElementById("btnRefresh").addEventListener("click", refreshLive);
    loadSample().catch((e) => {
      stampEl.textContent = "failed";
      toast(String(e && e.message ? e.message : e));
    });
  </script>
</body>
</html>
