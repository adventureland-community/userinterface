<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="user-scalable=yes, width=device-width, viewport-fit=cover"
    />
    <title>Comm overlay preview (stock host)</title>
    <style>
      @font-face {
        font-family: pixel;
        src: url(/css/fonts/m5x7.ttf);
        font-weight: normal;
        font-style: normal;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ddd;
        font: 16px/1.25 pixel, ui-sans-serif, monospace;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #progressui {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 201;
      }
      #bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 201;
        pointer-events: auto;
        text-align: center;
      }
      .ecu-meter-icon img,
      .ecu-game-icon img,
      .ecu-preview-icon img {
        image-rendering: pixelated;
      }
    </style>
    <!-- Stock /comm client stack (adventureland_mongodb/htmls/comm.html @ upstream/main). -->
    <script>
      /* Phrase + early stubs before stock JS (server injects these on live /comm). */
      window.__ecuOverlayPreview = true;
      window.__ecuAssetOrigin = "";
      function phrase(s) {
        return s == null ? "" : String(s);
      }
      phrase.language = "en";
      phrase.html = function (s) {
        return phrase(s);
      };
      window.phrase = phrase;
      /* Shell / Playwright: ?view=phone|desktop seeds layout before ECU mounts. */
      (function () {
        try {
          var view = new URLSearchParams(location.search).get("view");
          if (view !== "phone" && view !== "desktop") return;
          var key = "al-comm-ui-settings-v1";
          var o = {};
          try {
            o = JSON.parse(localStorage.getItem(key) || "{}") || {};
          } catch (e) {
            o = {};
          }
          o.layoutProfileMode = view;
          localStorage.setItem(key, JSON.stringify(o));
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <script src="/js/pixi/4.8.2-roundpixels/pixi.min.js"></script>
    <script src="/js/pixi-layers/0.1.7.2/pixi-layers.js"></script>
    <script src="/js/pixi-filters/2.6.0c0/pixi-filters.js"></script>
    <script src="/js/jquery/jquery-3.2.0.min.js"></script>
    <script src="/js/libraries/bowser/bowser.16.08.16.js"></script>
    <script src="/js/old_common_functions.js"></script>
    <script src="/js/functions.js"></script>
    <script src="/js/generated_zones.js"></script>
    <script src="/js/event_schedule.js"></script>
    <script src="/js/witch_cipher.js"></script>
    <script src="/js/entity_animations.js"></script>
    <script src="/js/game.js"></script>
    <script src="/js/html.js"></script>
    <script src="/data.js"></script>
    <script>

      if (typeof window.Cookies === "undefined") {
